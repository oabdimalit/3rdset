 ______","3. How about → ______","4. 'd better → ______","5. If I were you → ______"]},{"title":"Exercise 2. should, had better или don't have to?","items":["1. You ______ leave now or you'll miss the train.","2. You ______ try this café — the coffee is great.","3. You ______ come early; the meeting starts at ten.","4. You ______ see a doctor if the pain continues.","5. You ______ answer emails at night. Nobody expects it."]},{"title":"Exercise 3. Исправь ошибку в каждом предложении.","items":["1. You had better to call him today.","2. Why don't you to take a break?","3. How about to go for a walk?","4. You should to ask for help.","5. You don't must answer at night."]}],"speaking":["Four ways: преподаватель называет проблему, студент даёт четыре совета разными конструкциями подряд. Пять проблем.","Real problem: студент приносит настоящую проблему, преподаватель задаёт уточняющие вопросы и советует. Потом роли меняются.","Push back: на каждый совет студент отвечает «That's easier said than done», а преподаватель защищает совет. Тренируем спор.","Two minutes: «The best advice I've ever received» — кто, когда, послушал ли."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. You ______ leave now or you'll miss the train. (had better)","2. Why ______ you ask your manager?","3. How about ______ (take) a day off?","4. You ______ see a doctor. (should)","5. You ______ answer emails at night. Nobody expects it.","6. Переведи: перегруженный — ______","7. Переведи: выгореть — ______","8. Переведи: ставить границы — ______","9. Переведи: по одному делу за раз — ______","10. Исправь: You had better to call him."],"a":"1 'd better / had better · 2 don't · 3 taking · 4 should · 5 don't have to · 6 overwhelmed · 7 burn out · 8 set limits · 9 one thing at a time · 10 You had better call him."},{"t":"Test 2 · фразовые глаголы","items":["1. ______ up — it'll pass. (Cheer)","2. ______ down and start again. (Calm)","3. It took a month to ______ it. (get over)","4. I won't ______ that. (put up with)","5. Let's ______ this out today. (sort)","6. Переведи: просить помощи — ______","7. Переведи: сделать перерыв — ______","8. Переведи: это не конец света — ______","9. Переведи: приоритет — ______","10. Переведи: справиться с этим — ______"],"a":"1 Cheer · 2 Calm · 3 get over · 4 put up with · 5 sort · 6 ask for help · 7 take a break · 8 it's not the end of the world · 9 priority · 10 deal with it"},{"t":"Test 3 · Повторение: модальные глаголы (уроки 9, 18, 21)","items":["1. You ______ show your passport at the border.","2. You ______ take photos here. It's forbidden.","3. You ______ tip — it's not the custom.","4. ______ I borrow your pen?","5. You ______ drink more water. (совет)","6. Passengers ______ fasten their seat belts.","7. I ______ work on Saturday. My boss asked me.","8. ______ you repeat that, please? (вежливо)","9. You ______ bring a present, but it's nice.","10. Переведи: обязательно / необязательно — ______"],"a":"1 must / have to · 2 mustn't · 3 don't have to · 4 Can/Could · 5 should · 6 must · 7 have to · 8 Could · 9 don't have to · 10 must / don't have to"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать ответ на письмо с проблемой — 150 слов, минимум четыре разные конструкции совета.","Аудио: 2 минуты — рассказать о проблеме и дать себе три совета вслух."],"cando":["I can describe a problem clearly.","I can give advice in four different ways.","I can push back politely when advice doesn't fit."]},{"n":33,"en":"People and places I love","ru":"Описываем людей и места","goal":"I can describe a person or a place in detail and make it interesting.","goalRu":"Могу подробно описать человека или место так, чтобы было интересно слушать.","gramA":"Относительные придаточные: who / which / that / where","gramB":"Повторение: прилагательные и наречия, сравнения (уроки 8, 22)","recycle":"Уроки 8, 22 — сравнения, характер, наречия","starters":["Describe a person who changed something in your life.","What is a place in your city that tourists never find?","Who is the most interesting person you have met in the last year?"],"vocab":[["kind of person","тип человека","He's the kind of person who listens."],["remind me of","напоминать мне о","This place reminds me of my village."],["atmosphere","атмосфера","The atmosphere there is calm."],["crowded","многолюдный","The centre is crowded at six."],["cosy","уютный","It's a small cosy café."],["hidden","скрытый","It's a hidden place behind the market."],["view","вид","The view from the roof is amazing."],["used to be","раньше был","It used to be a factory."],["generous","щедрый","My grandmother was very generous."],["stubborn","упрямый","He's stubborn but honest."],["sense of humour","чувство юмора","She has a great sense of humour."],["down-to-earth","приземлённый, простой в общении","He's famous but down-to-earth."],["make an effort","стараться","He always makes an effort with new people."],["look up to","уважать, брать пример","I look up to my first manager."]],"phrases":["He's the kind of person who…","She's someone who always…","It's a place where you can…","What I like most about it is…","It reminds me of…","You'd love it — it's exactly your style.","It's not famous, but…","If you ever go there, you must try…","I've known her since…","He taught me that…"],"pv":[["look up to","уважать, равняться","I look up to my older sister."],["get on with","ладить","I get on with almost everyone."],["take after","быть похожим на (родственника)","She takes after her father."],["grow up","расти","I grew up in a small town."],["show around","показать окрестности","Let me show you around."]],"rulesA":["who — о людях: He's the man who helped me. that тоже можно: the man that helped me.","which — о вещах: It's a café which opens at seven. that тоже можно.","where — о местах: It's a place where everybody knows your name.","Относительное слово заменяет подлежащее — второе местоимение не нужно: the man who he helped me — ошибка.","Эти конструкции делают речь взрослой. Сравни: He's nice. He helps everybody. → He's the kind of person who helps everybody."],"rulesB":["Прилагательное описывает человека: She is careful. Наречие — действие: She works carefully.","good → well, fast → fast, hard → hard. hardly = почти не, это другое слово.","Сравнение: cheaper than, more expensive than, the best, the most reliable.","Усилители: much / far / a bit + сравнительная. He's much kinder than he looks."],"examples":["She's the kind of person who remembers your name after one meeting.","It's a small café where the owner cooks everything himself.","It used to be a factory, which is why the ceilings are so high."],"text":{"title":"The café with no sign","words":225,"body":["There's a café in my city which has no sign, no menu and no website. You find it because somebody takes you there.","It used to be a bread shop. The owner, a woman called Gulnara, is the kind of person who remembers what you ordered a year ago. She doesn't ask what you want. She looks at you and brings something.","The first time my friend took me, I thought it was strange. Nine tables, no prices, an old radio. But there's an atmosphere there which I haven't found anywhere else. Nobody looks at a phone. People talk.","Gulnara grew up in a village in the south and moved here at nineteen with no money. She says the café is not a business, it's a living room that happens to sell food.","The strange part is the customers. A taxi driver, two university professors, a famous singer, my neighbour. In any other place in the city those people would never sit at the same table. Here they do, because there aren't enough tables.","If you ever come to my city, I won't show you the museum. I'll take you there. And Gulnara will look at you, think for two seconds, and bring you exactly what you need.","She's never wrong."]},"textQs":["1. What three things does the café not have?","2. What kind of person is Gulnara?","3. How does ordering work there?","4. Why do very different people sit together?","5. What does Gulnara call her café, and what does she mean?","6. Describe a place in your city that visitors would never find alone."],"opinions":{"title":"Кого вы бы описали? Четыре ответа","lines":["DINA: My first manager — a woman who told me the truth when it was uncomfortable. I look up to her ten years later.","MARAT: My grandfather. He was stubborn, generous and completely down-to-earth. I take after him, unfortunately — the stubborn part.","AIDA: There's a bookshop near the station where the owner lets you read for two hours and buy nothing.","BEK: A teacher who made an effort with the weakest students, not the best ones. I was one of the weak ones."],"tasks":["1. Who describes a place, not a person?","2. Who admits a negative quality about himself?","3. Find four relative clauses with who, which or where.","4. Write your own two lines: one about a person, one about a place."]},"audio":{"type":"Listen: describing a person","script":"I want to tell you about my aunt Saule. She's the kind of person who never says much, but you notice when she isn't in the room. She grew up in a village where everybody worked on the land, and she was the first in the family to finish university. She taught maths for thirty-one years. Her students still call her — I've met three of them, and all three said the same thing: she was strict but she never made anybody feel stupid. She has a sense of humour that comes out once an hour, very quietly. And she makes the best plov I've ever eaten, which she will deny if you ask her.","note":"Читай тепло, не торопясь. Два раза.","tasks":["1. What is special about her presence in a room?","2. Where did she grow up?","3. What was she the first in her family to do?","4. How long did she teach, and what subject?","5. What do her former students say about her?","6. Найди в тексте три относительных придаточных."],"answers":"1 Говорит мало, но её отсутствие замечают. · 2 В деревне, где все работали на земле. · 3 Первая в семье закончила университет. · 4 Тридцать один год, математика. · 5 Строгая, но никогда не давала почувствовать себя глупым. · 6 …person who never says much · a village where everybody worked · a sense of humour that comes out…"},"dialogue":{"title":"You'd love it there","setting":"Aida (A) уговаривает Bek (B) поехать в её родной город.","lines":[["A","Bek, you should come with us in August. You'd love it there."],["B","What's actually there? Honestly."],["A","Nothing famous. That's the point."],["B","Sell it to me."],["A","OK. There's a street market which opens at five in the morning and closes at nine."],["B","Nine in the evening?"],["A","Nine in the morning. Four hours, and then the city is quiet again."],["B","That's strange enough to be interesting."],["A","And there's a woman who sells apricots there. She's the kind of person who gives you three to try before you buy anything."],["B","You're describing fruit to me."],["A","I'm describing an atmosphere. Nobody is in a hurry. It reminds me of how things used to be."],["B","What about the evening? I'm not going to bed at nine."],["A","There's a place on the hill where you can see the whole valley. Everyone goes there at sunset."],["B","Everyone as in twenty people?"],["A","Everyone as in the whole town. That's the part I miss most."],["B","Fine. But if there's no coffee, I'm leaving on day two."],["A","There's coffee. My mother makes it. You'll never want the café version again."]],"tasks":["Прочитай диалог вслух за обе роли.","Найди все относительные придаточные — их пять.","Переиграй: уговори преподавателя поехать в твой родной город.","Запиши себя за Aida — 90 секунд."]},"ex":[{"title":"Exercise 1. who, which или where?","items":["1. He's the man ______ helped me at the airport.","2. It's a café ______ opens at seven.","3. That's the village ______ I grew up.","4. She's someone ______ never says no.","5. It's a book ______ changed my mind about work.","6. This is the office ______ I spent four years."]},{"title":"Exercise 2. Соедини два предложения в одно.","items":["1. She's a teacher. She never shouts. → ______","2. It's a small town. Everybody knows everybody there. → ______","3. He's a colleague. He always helps new people. → ______","4. It's an old building. It used to be a factory. → ______","5. That's the restaurant. We met there in 2021. → ______"]},{"title":"Exercise 3. Прилагательное или наречие?","items":["1. She is a ______ worker. (careful / carefully)","2. He explained it very ______. (patient / patiently)","3. She speaks English ______. (good / well)","4. He's ______ kinder than he looks. (much / many)","5. They work ______. (hard / hardly)"]}],"speaking":["Three people: описать трёх человек по 60 секунд каждого, в каждом описании минимум два относительных придаточных.","Sell your city: за две минуты уговорить преподавателя приехать. Запрещено называть известные достопримечательности.","Guess who: студент описывает человека из своей жизни, преподаватель задаёт вопросы и угадывает его роль.","Two minutes: «A person I look up to» — кто, за что, чему научил."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. He's the man ______ helped me.","2. It's a café ______ opens at seven.","3. That's the town ______ I grew up.","4. She's the ______ of person who listens. (kind)","5. Переведи: напоминать мне о — ______","6. Переведи: уютный — ______","7. Переведи: щедрый — ______","8. Переведи: чувство юмора — ______","9. It ______ to be a factory. (used)","10. Соедини: She's a teacher. She never shouts. → ______"],"a":"1 who/that · 2 which/that · 3 where · 4 kind · 5 remind me of · 6 cosy · 7 generous · 8 sense of humour · 9 used · 10 She's a teacher who never shouts."},{"t":"Test 2 · фразовые глаголы","items":["1. I ______ my older sister. (look up to)","2. I ______ almost everyone. (get on with)","3. She ______ her father. (takes after)","4. I ______ in a small town. (grew up)","5. Let me ______ you ______. (show around)","6. Переведи: упрямый — ______","7. Переведи: приземлённый, простой — ______","8. Переведи: стараться — ______","9. Переведи: многолюдный — ______","10. Переведи: вид (из окна) — ______"],"a":"1 look up to · 2 get on with · 3 takes after · 4 grew up · 5 show / around · 6 stubborn · 7 down-to-earth · 8 make an effort · 9 crowded · 10 view"},{"t":"Test 3 · Повторение: сравнения и наречия (уроки 8, 22)","items":["1. This hotel is ______ (cheap) than that one.","2. It's the ______ (good) café in the city.","3. She works very ______ (careful).","4. He speaks English ______. (well / good)","5. It's ______ more expensive than I expected. (much)","6. She is the ______ (reliable) person in the team.","7. This model is ______ (popular) than that one.","8. Переведи: надёжный — ______","9. Переведи: терпеливый — ______","10. The more you practise, the ______ you become. (confident)"],"a":"1 cheaper · 2 best · 3 carefully · 4 well · 5 much · 6 most reliable · 7 more popular · 8 reliable · 9 patient · 10 more confident"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 180 слов: «A person who changed something in my life». Минимум шесть относительных придаточных.","Аудио: 2 минуты — описать место, которое ты любишь, не называя известных достопримечательностей."],"cando":["I can describe a person with relative clauses.","I can describe a place so somebody wants to go there.","I can use who, which and where correctly."]},{"n":34,"en":"He said, she said","ru":"Передаём чужие слова","goal":"I can report what other people said and asked.","goalRu":"Могу пересказать чужие слова и вопросы.","gramA":"Reported speech: said / told / asked · сдвиг времён","gramB":"Повторение: Past Simple и вопросы (уроки 5, 15)","recycle":"Уроки 15, 16, 23 — телефон, письма, проблемы","starters":["When did somebody last misunderstand what you said?","Do you prefer to hear news directly or through other people?","Have you ever had to pass on bad news from someone else?"],"vocab":[["mention","упомянуть","He mentioned your name."],["promise","обещать","She promised to call."],["warn","предупредить","I warned him about the traffic."],["explain","объяснить","He explained the delay."],["complain","жаловаться","She complained about the noise."],["admit","признать","He admitted his mistake."],["refuse","отказаться","They refused to pay."],["suggest","предложить","She suggested a later meeting."],["insist","настаивать","He insisted on paying."],["misunderstand","не так понять","I think you misunderstood me."],["exactly","точно","What exactly did he say?"],["rumour","слух","It's just a rumour."],["in other words","другими словами","In other words, he said no."],["according to","по словам","According to Marat, the client agreed."]],"phrases":["He said that…","She told me that…","He asked me if…","She wanted to know…","What exactly did he say?","To be fair, he did say…","According to him…","That's not what I heard.","I think there's been a misunderstanding.","Let me check with her and get back to you."],"pv":[["pass on","передать (сообщение)","Can you pass on the message?"],["bring up","упомянуть, поднять тему","He brought up the salary."],["find out","выяснить","I'll find out what he meant."],["clear up","прояснить","Let's clear up the misunderstanding."],["go back on","отказаться от слов","He went back on his promise."]],"rulesA":["Время сдвигается на шаг назад: 'I work here' → He said he worked there. 'I have finished' → She said she had finished.","say и tell: say не требует адресата (He said that…), tell требует (He told me that…). Нельзя He said me.","Вопросы без вопросительного слова → if / whether: 'Are you free?' → She asked if I was free. Порядок слов становится прямым, без do/did.","Вопросы с вопросительным словом: 'Where do you work?' → He asked where I worked.","Меняются и слова времени и места: today → that day, tomorrow → the next day, here → there."],"rulesB":["Past Simple: did + первая форма в вопросе. What did he say?","Правильные и неправильные: said, told, asked, explained — выучить как блок.","Отрицание: He didn't say that. She didn't tell me.","Who said that? — без did, потому что who и есть подлежащее."],"examples":["He said he would call back before six.","She told me she had already sent the invoice.","The client asked if we could change the date."],"text":{"title":"Three versions of one sentence","words":220,"body":["Last spring a small sentence went around our office for two weeks and almost cost us a client.","It started at a meeting. The client said, 'We're not sure about the timeline.' That is all he said.","The person who was there told the project manager that the client was worried about the deadline. The project manager told the team that the client might cancel. By Friday somebody in another department told me the client had already cancelled.","Nothing had happened. The client was simply not sure about dates in October.","What interests me is the direction. Every version was more dramatic than the last. Nobody added good news by mistake.","We fixed it in one phone call. Our director asked the client directly what exactly he had meant. The client laughed and said he had meant October, nothing more.","Since then we have one rule in the team. If you pass on information from a meeting, you use the person's own words, not your summary. 'He said he wasn't sure about the timeline' — not 'he has a problem'.","It sounds small. It saved us a client, and about six people a week of stress."]},"textQs":["1. What exactly did the client say at the meeting?","2. List how the message changed at each step.","3. What had actually happened?","4. What does the writer notice about the direction of the changes?","5. What is the team's rule now?","6. Have you seen a message change like this? Tell the story."],"opinions":{"title":"Рабочий чат: кто что сказал","lines":["MARAT: The client told me he needed the report by Friday, not Monday.","DINA: That's not what I heard. He asked if Friday was possible — that's different.","AIDA: According to the email, he wrote 'ideally Friday'. So Dina is right.","BEK: Let's clear this up before somebody promises something. I'll find out and get back to you."],"tasks":["1. What is the difference between Marat's version and Dina's?","2. Who checks the original source?","3. Find one reported statement and one reported question.","4. Write Bek's message to the client asking to confirm — two sentences."]},"audio":{"type":"Listen and report","script":"Anna said: 'I'm working on the budget this week. I've already finished the first part, but I haven't sent it yet. I'll send everything on Thursday.' Then she asked: 'Are you free on Friday morning? Can we go through it together? And where is the meeting room — on the second floor?'","note":"Читай один раз как прямую речь, потом второй раз. Студент пересказывает в reported speech.","tasks":["1. Anna said she ______ on the budget that week.","2. She said she ______ already ______ the first part.","3. She said she ______ sent it ______.","4. She said she ______ send everything on Thursday.","5. She asked ______ I ______ free on Friday morning.","6. She asked where the meeting room ______."],"answers":"1 was working · 2 had / finished · 3 hadn't / yet · 4 would · 5 if / was · 6 was"},"dialogue":{"title":"That's not what he said","setting":"Dina (D) и Erlan (E) выясняют, что именно сказал клиент.","lines":[["D","Erlan, did you speak to the client yesterday?"],["E","I did. Why?"],["D","Marat told me the client wants to cancel the project."],["E","What? That's not what he said."],["D","That's what I heard. What exactly did he say?"],["E","He said he wasn't sure about the budget for next year."],["D","That's very different from cancelling."],["E","Completely different. He also asked if we could send a smaller version of the plan."],["D","So he's still interested."],["E","He told me twice that he liked the idea. He just doesn't know his own budget yet."],["D","Then where did 'cancel' come from?"],["E","Probably from me, to be fair. I said the project 'might not happen in January'."],["D","And by lunchtime that became 'the client is leaving'."],["E","Exactly. I'll clear it up with Marat today."],["D","Do it now. And send one email to everybody with the client's own words."],["E","Good idea. In his words, not mine."]],"tasks":["Прочитай диалог вслух за обе роли.","Выпиши все предложения в reported speech — их шесть.","Переиграй: ты передаёшь коллеге то, что сказал преподаватель на уроке.","Запиши себя за Erlan — 90 секунд."]},"ex":[{"title":"Exercise 1. Переведи в косвенную речь.","items":["1. 'I work in sales.' → He said ______","2. 'We have finished the report.' → They said ______","3. 'I'll call you tomorrow.' → She said ______","4. 'I'm waiting at the gate.' → He said ______","5. 'I didn't send it.' → She said ______"]},{"title":"Exercise 2. Вопросы в косвенной речи.","items":["1. 'Are you free on Monday?' → She asked ______","2. 'Where do you work?' → He asked ______","3. 'Did you send the invoice?' → They asked ______","4. 'What time does it start?' → She wanted to know ______","5. 'Can you help me?' → He asked ______"]},{"title":"Exercise 3. say или tell? Исправь, если нужно.","items":["1. He said me that he was busy.","2. She told that the meeting was cancelled.","3. He told me he would come.","4. They said they had finished.","5. She said me the truth."]}],"speaking":["Chinese whispers: преподаватель говорит фразу, студент пересказывает в reported speech, потом преподаватель усложняет. Десять фраз.","Report the meeting: преподаватель играет клиента и говорит пять реплик, студент после каждой пересказывает коллеге.","Exactly what he said: студент получает «слух» и должен задать три уточняющих вопроса, чтобы выяснить исходные слова.","Two minutes: «A time when somebody misunderstood me» — история с прямой и косвенной речью."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. 'I work here.' → He said he ______ there.","2. 'We have finished.' → They said they ______ finished.","3. 'Are you free?' → She asked ______ I was free.","4. 'Where do you work?' → He asked where I ______.","5. 'I'll call you.' → She said she ______ call me.","6. Исправь: He said me that he was busy. → ______","7. Переведи: по словам (кого-то) — ______","8. Переведи: другими словами — ______","9. Переведи: предупредить — ______","10. Переведи: не так понять — ______"],"a":"1 worked · 2 had · 3 if/whether · 4 worked · 5 would · 6 He told me that he was busy. · 7 according to · 8 in other words · 9 warn · 10 misunderstand"},{"t":"Test 2 · фразовые глаголы","items":["1. Can you ______ the message? (pass on)","2. He ______ the salary at the meeting. (brought up)","3. I'll ______ what he meant. (find out)","4. Let's ______ the misunderstanding. (clear up)","5. He ______ his promise. (went back on)","6. Переведи: настаивать — ______","7. Переведи: отказаться — ______","8. Переведи: предложить (идею) — ______","9. Переведи: слух — ______","10. Переведи: признать (ошибку) — ______"],"a":"1 pass on · 2 brought up · 3 find out · 4 clear up · 5 went back on · 6 insist · 7 refuse · 8 suggest · 9 rumour · 10 admit"},{"t":"Test 3 · Повторение: Past Simple и вопросы (уроки 5, 15, 29)","items":["1. What ______ he say? (did)","2. Who ______ (call) this morning?","3. I ______ (not / hear) the phone.","4. ______ you send the email yesterday?","5. She ______ (leave) the office at six.","6. ______ you ever worked abroad?","7. I ______ (work) in Turkey in 2021.","8. Переведи: перезвонить — ______","9. Could you ______ that, please? (repeat)","10. How long ______ you worked here?"],"a":"1 did · 2 called · 3 didn't hear · 4 Did · 5 left · 6 Have · 7 worked · 8 call back · 9 repeat · 10 have"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 150 слов: пересказать разговор, который у тебя был на этой неделе. Минимум восемь предложений в косвенной речи.","Аудио: 2 минуты — пересказать содержание телефонного разговора или встречи."],"cando":["I can report what somebody said.","I can report questions with if and question words.","I can check what somebody exactly meant."]},{"n":35,"en":"How things are made","ru":"Как всё устроено: пассив","goal":"I can explain how something is made, done or organised.","goalRu":"Могу объяснить, как что-то делается, производится и организовано.","gramA":"Passive voice: is made / was built / will be done","gramB":"Повторение: there is / are и предлоги места (уроки 4, 17)","recycle":"Уроки 4, 17, 20 — аэропорт, офис, деньги","starters":["What is your country famous for producing?","Describe your job in three steps: what comes in, what you do, what goes out.","What is something you own that is made by hand?"],"vocab":[["produce","производить","This factory produces bread."],["be made of / from","сделан из","It's made of wood."],["by hand","вручную","Everything is made by hand."],["process","процесс","The whole process takes two days."],["stage / step","этап / шаг","There are four stages."],["deliver","доставлять","Orders are delivered on Fridays."],["check / inspect","проверять","Every item is checked twice."],["packaging","упаковка","The packaging is recycled."],["supplier","поставщик","We have three suppliers."],["quality","качество","Quality is checked at every stage."],["be responsible for","отвечать за","Who is responsible for this?"],["be built","быть построенным","It was built in 1974."],["be organised","быть организованным","The event is organised by our team."],["handle","обрабатывать, заниматься","Complaints are handled by Aida."]],"phrases":["It's made of…","It's produced in…","First the… is checked, then…","The whole process takes…","It was built in…","It's done by hand.","Who is responsible for…?","It's handled by our team.","Let me walk you through the process.","That part is done automatically."],"pv":[["carry out","выполнять","Checks are carried out daily."],["set up","наладить, установить","The system was set up last year."],["put together","собрать","The report is put together by two people."],["take apart","разобрать","The machine is taken apart once a month."],["hand over","передать","The keys are handed over at reception."]],"rulesA":["Пассив = be + третья форма. Present: is / are made. Past: was / were made. Future: will be made.","Пассив нужен, когда важно ДЕЙСТВИЕ, а не кто его делает: The report is sent every Monday. Кто отправляет — неважно.","Если исполнитель важен, добавляем by: The event is organised by our team.","Сравни: We check every item (активно) → Every item is checked (пассивно). Второе звучит профессиональнее в описании процессов.","Частая ошибка: пропуск be. The report sent — неверно. The report is sent."],"rulesB":["there is + единственное, there are + множественное: There is a printer. There are two offices.","Предлоги места: in, on, under, next to, between, behind, opposite, near.","Вопрос: Is there…? Are there…? Отрицание: There isn't / There aren't any.","В описании процесса часто вместе: There are four stages, and each stage is checked."],"examples":["Our bread is made by hand and delivered the same morning.","The building was built in 1974 and renovated two years ago.","All complaints are handled by one person, which is why they're answered fast."],"text":{"title":"Four hours of bread","words":215,"body":["My uncle owns a small bakery with six employees. I worked there for one summer, and I still think it is the best-organised place I have ever seen.","Everything starts at three in the morning. The flour is delivered on Mondays and Thursdays by the same supplier he has used for nineteen years. The dough is made by hand — not because it's romantic, but because he says the machine version is checked by nobody.","While the dough is resting, the ovens are cleaned. At five the first bread is baked. At six the shop opens.","Here is the part I liked most. Every morning one loaf is taken from the middle of the batch and cut open by my uncle himself. If he isn't happy, that whole batch is sold at half price and nobody argues.","Bread that isn't sold by seven in the evening is given to a kitchen two streets away. Nothing is thrown out.","My uncle has never read a book about management. But his system is simple: one person is responsible for each stage, and the quality is checked by the person whose name is on the door.","That's why the bread is good."]},"textQs":["1. When and how is the flour delivered?","2. Why is the dough made by hand?","3. What happens while the dough is resting?","4. Describe the quality check in your own words.","5. What happens to unsold bread?","6. Describe one process from your own work in four steps, using the passive."],"opinions":{"title":"Как устроена работа: четыре ответа","lines":["AIDA: In our office complaints are handled by one person. It sounds risky, but nothing gets lost.","MARAT: Our reports are put together by three departments, which is why they're always late.","DINA: Everything is checked twice — once by the person who did it, once by somebody else.","BEK: Honestly, nothing is organised. Things are done when somebody remembers. That's the real answer."],"tasks":["1. Whose system has a clear owner for each task?","2. Whose process is slowed down by too many people?","3. Find four passive sentences.","4. Write two sentences about how things are organised in your workplace."]},"audio":{"type":"Listen: how it works","script":"Let me walk you through the process. First, the order is received by email, usually before ten in the morning. Then it's checked by the sales team — we look at the address and the quantity, because most mistakes happen there. After that the order is sent to the warehouse, where it's packed by hand. The packaging is made from recycled paper; we changed that two years ago. Orders are collected by the courier at four, and they're delivered the next working day. If something goes wrong, the whole thing is handled by one person, not by a department.","note":"Читай как экскурсию по производству. Два раза.","tasks":["1. How is the order received, and by what time?","2. Who checks it, and what two things do they look at?","3. Where is the order packed, and how?","4. What is the packaging made from?","5. At what time does the courier collect the orders?","6. Who handles problems?"],"answers":"1 По email, обычно до десяти утра. · 2 Отдел продаж; адрес и количество. · 3 На складе, вручную. · 4 Из переработанной бумаги. · 5 В четыре. · 6 Один человек, а не отдел."},"dialogue":{"title":"Walk me through it","setting":"Новый сотрудник Bek (B) и Dina (D) на складе.","lines":[["B","Dina, can you walk me through the process? I don't want to break anything."],["D","Sure. Nothing is broken on day one — that's day three usually."],["B","Great start."],["D","So. Orders are received here, on this screen. They're checked by me or by Aida."],["B","Checked for what?"],["D","Address and quantity. Ninety per cent of complaints come from those two things."],["B","OK. And then?"],["D","Then the items are picked from the shelves and packed by hand. Nothing is packed by machine here."],["B","Why not?"],["D","Because our boxes are different sizes. A machine was set up in 2022 and it was taken apart in 2023."],["B","Understood. Who is responsible for the labels?"],["D","You are, from Monday."],["B","Right. And if something goes wrong?"],["D","It's handed over to me, and I deal with the client. You don't call clients in your first month."],["B","That's a relief, honestly."],["D","It's not kindness. It's because the first month is when mistakes are made."]],"tasks":["Прочитай диалог вслух за обе роли.","Выпиши все пассивные конструкции — их девять.","Переиграй: объясни новому коллеге процесс на своей работе.","Запиши себя за Dina — 90 секунд."]},"ex":[{"title":"Exercise 1. Поставь в пассив.","items":["1. They check every item. → Every item ______","2. Somebody built this house in 1974. → This house ______","3. We send the report every Monday. → The report ______","4. Our team organises the event. → The event ______","5. They will deliver the order tomorrow. → The order ______"]},{"title":"Exercise 2. Актив или пассив?","items":["1. The bread ______ (make) by hand every morning.","2. My uncle ______ (make) the bread himself.","3. The building ______ (build) in 1974.","4. They ______ (build) a new office last year.","5. Complaints ______ (handle) by one person.","6. Aida ______ (handle) all complaints."]},{"title":"Exercise 3. Опиши процесс в пять шагов, используя пассив.","items":["Тема на выбор: твой рабочий процесс · приготовление национального блюда · путь посылки","1. First, ______","2. Then ______","3. After that ______","4. ______","5. Finally, ______"]}],"speaking":["Walk me through it: объяснить процесс своей работы за две минуты, минимум шесть пассивных конструкций.","Factory tour: студент — гид на производстве, преподаватель задаёт вопросы «And what happens next?».","Reverse it: преподаватель даёт активное предложение, студент мгновенно переводит в пассив. Пятнадцать штук на скорость.","National dish: объяснить, как готовится блюдо твоей страны, не используя слово «you»."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. Every item ______ (check) twice.","2. This house ______ (build) in 1974.","3. The report ______ (send) every Monday.","4. The order ______ (deliver) tomorrow. (будущее)","5. The event is organised ______ our team. (by)","6. Переведи: сделан из дерева — ______","7. Переведи: вручную — ______","8. Переведи: отвечать за — ______","9. Переведи: поставщик — ______","10. Исправь: The report sent every Monday. → ______"],"a":"1 is checked · 2 was built · 3 is sent · 4 will be delivered · 5 by · 6 made of wood · 7 by hand · 8 be responsible for · 9 supplier · 10 The report is sent every Monday."},{"t":"Test 2 · фразовые глаголы","items":["1. Checks are ______ daily. (carried out)","2. The system was ______ last year. (set up)","3. The report is ______ by two people. (put together)","4. The machine is ______ once a month. (taken apart)","5. The keys are ______ at reception. (handed over)","6. Переведи: упаковка — ______","7. Переведи: этап — ______","8. Переведи: качество — ______","9. Переведи: доставлять — ______","10. Переведи: обрабатывать (заявки) — ______"],"a":"1 carried out · 2 set up · 3 put together · 4 taken apart · 5 handed over · 6 packaging · 7 stage/step · 8 quality · 9 deliver · 10 handle"},{"t":"Test 3 · Повторение: there is/are и предлоги (уроки 4, 17)","items":["1. ______ two printers on this floor.","2. ______ there a café near here?","3. The pens are ______ the drawer.","4. The kitchen is ______ to the meeting room. (next)","5. Put your bag ______ the belt.","6. There ______ any free rooms today. (отрицание)","7. My desk is ______ the window.","8. Переведи: не работает (о технике) — ______","9. Переведи: закончилась бумага — ______","10. ______ I borrow your charger?"],"a":"1 There are · 2 Is · 3 in · 4 next · 5 on · 6 aren't · 7 next to / by · 8 out of order · 9 we've run out of paper · 10 Can/Could"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 150 слов: описать процесс на своей работе от начала до конца. Минимум восемь пассивных конструкций.","Аудио: 2 минуты — «How my job works», как будто проводишь экскурсию."],"cando":["I can explain a process step by step.","I can use the passive in present, past and future.","I can say who is responsible for what."]},{"n":36,"en":"Culture and first impressions","ru":"Культура и первые впечатления","goal":"I can talk about cultural differences and avoid stereotypes.","goalRu":"Могу говорить о культурных различиях и не скатываться в стереотипы.","gramA":"Модальные для предположения: must be / can't be / might be","gramB":"Повторение: must / mustn't / don't have to (урок 21)","recycle":"Уроки 21, 27 — обычаи, мнение","starters":["What do foreigners usually get wrong about your country?","What surprised you most the first time you were abroad?","Is there a habit from another culture you've adopted?"],"vocab":[["stereotype","стереотип","That's just a stereotype."],["first impression","первое впечатление","First impressions are often wrong."],["assume","предполагать","Don't assume, ask."],["generalise","обобщать","It's easy to generalise."],["misunderstanding","недопонимание","It was a simple misunderstanding."],["polite / rude","вежливый / грубый","What's polite here is rude there."],["direct","прямой (в общении)","Germans are quite direct."],["small talk","светская беседа","Small talk takes longer in some cultures."],["personal space","личное пространство","Personal space is different everywhere."],["be used to","привыкший к","I'm not used to eating so late."],["adapt","адаптироваться","It took me a month to adapt."],["keep in mind","иметь в виду","Keep in mind that lunch is at one."],["offend","обидеть","I didn't mean to offend anyone."],["open-minded","непредвзятый","Travel makes you more open-minded."]],"phrases":["In my culture we usually…","That must be strange for you.","It can't be easy to…","That might be because…","I didn't mean to offend you.","Where I come from, it's normal to…","I'm not used to it yet.","Is it rude to…?","Correct me if I'm wrong.","That's a stereotype, to be honest."],"pv":[["fit in","вписаться","It took me a year to fit in."],["pick up","перенять, подхватить","I picked up a few habits there."],["come across as","производить впечатление","He comes across as cold, but he isn't."],["get used to","привыкнуть","I got used to the food quickly."],["look down on","смотреть свысока","Never look down on a culture you don't know."]],"rulesA":["must be — почти уверен, что это так: You've been travelling for 20 hours. You must be exhausted.","can't be — почти уверен, что это НЕ так: That can't be right — he left an hour ago.","might / may / could be — возможно: He might be in a meeting.","Это не про разрешение. Здесь must и can't показывают уверенность говорящего, а не правило.","Шкала: must be (95%) → might be (50%) → can't be (5%)."],"rulesB":["must / have to — обязательство: You must show your passport.","mustn't — запрещено: You mustn't take photos here.","don't have to — необязательно: You don't have to tip.","Не путай: mustn't и don't have to — противоположные вещи, а не синонимы."],"examples":["He didn't answer — he must be on a flight.","That can't be the right address; the street is in another district.","She might be quiet because she's new, not because she's unfriendly."],"text":{"title":"The colleague who never smiled","words":220,"body":["When a Finnish engineer joined our team, I decided within three days that he didn't like me.","He never smiled in meetings. He answered questions in six words. When I asked how his weekend was, he said 'Fine' and went back to his laptop. I told a colleague he must be unhappy here.","Six weeks later we were working late on a problem and he suddenly started talking. He talked for forty minutes — about his daughter, about the project, about a hiking trail near his home town.","So I asked him directly about the first weeks. He laughed and said something I think about often: 'In my country, if you smile at a stranger in the office, they think something is wrong with you. I thought you were all very nervous.'","We had spent six weeks reading each other completely wrong, and both of us were sure we were right.","He's been with us for four years now. He still doesn't smile much in meetings. But when he says a project is fine, everybody believes him, because he has never once said it when it wasn't.","The thing about first impressions is not that they're always wrong. It's that we never check them."]},"textQs":["1. What did the writer decide in the first three days?","2. Give two examples of the engineer's behaviour.","3. What happened six weeks later?","4. How did the engineer explain the first weeks?","5. Why does everybody believe him now?","6. Have you ever misread someone? What was the real explanation?"],"opinions":{"title":"Четыре наблюдения","lines":["DINA: In my first week in Germany I thought everybody was angry. They were just being direct.","MARAT: People say Americans are superficial because they ask 'How are you?' and don't wait. It's a greeting, not a question.","AIDA: Here guests must be offered tea three times. A foreigner who says no once is simply believed, and then feels forgotten.","BEK: Honestly, most 'cultural differences' at work are just individual personalities. That's a stereotype we all repeat."],"tasks":["1. Who warns against explaining everything by culture?","2. Which comment is about a greeting that isn't really a question?","3. Find one example of must and one of might or can't.","4. Write your own observation about your culture in two sentences."]},"audio":{"type":"Listen: guessing and explaining","script":"A: Have you seen Timur today? B: No. He must be working from home — his laptop isn't here. A: He might be at the client's office, actually. He mentioned a meeting. B: That can't be today; the client is in Almaty until Thursday. A: True. Then he must be at home. By the way, do you know why he never comes to the Friday lunch? B: I assumed he didn't like the team. A: I asked him last week. He has a class at one every Friday. He's been learning Spanish for two years. B: Two years? I had no idea. A: Exactly. We spent a year thinking he was unfriendly.","note":"Читай в два голоса. Два раза. Студент записывает предположения.","tasks":["1. What is B's first guess about Timur, and why?","2. What is A's alternative guess?","3. Why can't that be true?","4. What did B assume about the Friday lunch?","5. What is the real reason?","6. Выпиши три предложения с must be / might be / can't be."],"answers":"1 Работает из дома — ноутбука нет на месте. · 2 Может быть у клиента в офисе. · 3 Клиент в Алматы до четверга. · 4 Что ему не нравится команда. · 5 У него занятие испанским каждую пятницу в час. · 6 He must be working from home · He might be at the client's office · That can't be today."},"dialogue":{"title":"Is it rude to…?","setting":"Erlan (E) готовит иностранного коллегу Tom (T) к ужину в гостях.","lines":[["T","Erlan, I need a quick briefing. I don't want to offend anybody tonight."],["E","You won't. But there are three things worth knowing."],["T","Go on."],["E","First, you must take off your shoes at the door. Always."],["T","Easy. Second?"],["E","You don't have to eat everything, but you must try everything."],["T","What if I really don't like it?"],["E","Take a small piece and say it's delicious. Nobody checks."],["T","And the third?"],["E","Don't refuse tea. If you say no, people think something is wrong."],["T","Is it rude to leave early?"],["E","A bit. But if you say you have an early flight, that's accepted."],["T","Should I bring something?"],["E","You don't have to, but sweets or fruit are always right."],["T","One more. My colleague says people here might ask about my salary."],["E","That can't be a surprise — you asked me the same thing in week one."],["T","Fair. So it's normal?"],["E","It's normal. Answer or joke, both work. Nobody will be offended."]],"tasks":["Прочитай диалог вслух за обе роли.","Выпиши все must, mustn't и don't have to — объясни выбор каждого.","Переиграй: ты готовишь иностранца к ужину у твоей семьи.","Запиши себя за Erlan — 90 секунд."]},"ex":[{"title":"Exercise 1. must be, might be или can't be?","items":["1. He left an hour ago. He ______ home by now.","2. That ______ right — the shop closes at six.","3. She didn't answer. She ______ in a meeting.","4. You've been travelling for 20 hours. You ______ exhausted.","5. It ______ his car — his is blue, not red."]},{"title":"Exercise 2. must, mustn't или don't have to?","items":["1. You ______ take off your shoes here.","2. You ______ take photos in the museum. It's forbidden.","3. You ______ bring a present, but it's nice.","4. Guests ______ try everything, even a small piece.","5. You ______ answer the salary question if you don't want to."]},{"title":"Exercise 3. Переформулируй стереотип в наблюдение.","items":["Образец: «Germans are cold» → «Some Germans come across as direct, which might sound cold at first.»","1. «Italians are always late.» → ______","2. «British people are polite but not friendly.» → ______","3. «Americans are superficial.» → ______","4. «People here never say no.» → ______"]}],"speaking":["Culture briefing: подготовить иностранца к первому рабочему дню в твоей стране — восемь пунктов.","Guess the reason: преподаватель описывает странное поведение, студент даёт три версии с must be / might be / can't be.","Stereotype check: преподаватель называет стереотип, студент переформулирует его в честное наблюдение.","Two minutes: «A misunderstanding I had with a person from another culture»."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. He left an hour ago. He ______ home by now. (must)","2. That ______ be right — the shop closes at six.","3. She didn't answer. She ______ be in a meeting. (might)","4. You ______ take photos here. It's forbidden.","5. You ______ bring a present, but it's nice.","6. Переведи: стереотип — ______","7. Переведи: первое впечатление — ______","8. Переведи: обидеть — ______","9. Переведи: привыкнуть к — ______","10. Переведи: предполагать — ______"],"a":"1 must be · 2 can't · 3 might · 4 mustn't · 5 don't have to · 6 stereotype · 7 first impression · 8 offend · 9 get used to · 10 assume"},{"t":"Test 2 · фразовые глаголы","items":["1. It took me a year to ______. (fit in)","2. I ______ a few habits there. (picked up)","3. He ______ cold, but he isn't. (comes across as)","4. I ______ the food quickly. (got used to)","5. Never ______ a culture you don't know. (look down on)","6. Переведи: обобщать — ______","7. Переведи: личное пространство — ______","8. Переведи: непредвзятый — ______","9. Переведи: иметь в виду — ______","10. Переведи: недопонимание — ______"],"a":"1 fit in · 2 picked up · 3 comes across as · 4 got used to · 5 look down on · 6 generalise · 7 personal space · 8 open-minded · 9 keep in mind · 10 misunderstanding"},{"t":"Test 3 · Повторение: правила и обычаи (уроки 9, 21)","items":["1. You ______ show your passport at the border.","2. You ______ smoke here. It's forbidden.","3. You ______ tip — it's not the custom.","4. It's ______ to be late. (rude)","5. It's ______ to bring sweets. (polite)","6. Is it OK ______ take photos? (to)","7. Переведи: обычай — ______","8. Переведи: снимать обувь — ______","9. Переведи: государственный праздник — ______","10. Переведи: уважать традиции — ______"],"a":"1 must/have to · 2 mustn't · 3 don't have to · 4 rude · 5 polite · 6 to · 7 custom · 8 take off your shoes · 9 public holiday · 10 respect traditions"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 150 слов: «A cultural misunderstanding» — реальная или вымышленная история.","Аудио: 2 минуты — инструктаж для иностранца, который приезжает в твою страну."],"cando":["I can guess and explain with must be, might be and can't be.","I can explain customs without stereotyping.","I can check a first impression instead of trusting it."]},{"n":37,"en":"Keeping the conversation alive","ru":"Как не дать разговору умереть","goal":"I can keep a conversation going for ten minutes without awkward silence.","goalRu":"Могу поддерживать разговор десять минут без неловких пауз.","gramA":"Разделительные вопросы (question tags) · эхо-вопросы · заполнители паузы","gramB":"Повторение: косвенные вопросы (урок 9)","recycle":"Уроки 9, 14, 27 — вопросы, small talk, мнение","starters":["What do you do when a conversation in English goes silent?","Who is the easiest person you know to talk to? What do they do?","Is silence uncomfortable for you, or normal?"],"vocab":[["awkward silence","неловкая пауза","There was an awkward silence."],["keep going","продолжать","Just keep going, don't stop."],["change the subject","сменить тему","Let's change the subject."],["go off topic","уйти от темы","Sorry, I went off topic."],["have something in common","иметь общее","We have a lot in common."],["follow-up question","уточняющий вопрос","Always ask a follow-up question."],["pause","пауза","A short pause is normal."],["interrupt","перебивать","Sorry to interrupt."],["get back to","вернуться к","Let's get back to what you said."],["sound interested","звучать заинтересованно","Try to sound interested."],["talkative","разговорчивый","He's very talkative."],["one-word answer","односложный ответ","One-word answers kill conversations."],["bring up a topic","поднять тему","She brought up a great topic."],["wrap up","завершать","Let's wrap up and go."]],"phrases":["Really? Tell me more.","That's interesting — how come?","Oh, did you? / Oh, have you?","What was that like?","Same here, actually.","Speaking of which…","Sorry, I didn't catch that.","Anyway, what about you?","Let me think for a second.","That reminds me of something."],"pv":[["open up","разговориться","People open up when you listen."],["cut in","вклиниться в разговор","Sorry to cut in."],["go on","продолжать","Go on, I'm listening."],["dry up","иссякнуть (о разговоре)","The conversation dried up."],["catch up","поболтать, наверстать","Let's catch up next week."]],"rulesA":["Question tag — короткий хвост для поддержания разговора: It's hot today, isn't it? You work in sales, don't you?","Правило: утверждение + отрицательный хвост, отрицание + положительный хвост. You're new, aren't you? You don't smoke, do you?","Эхо-вопрос показывает интерес: 'I worked in Dubai.' — 'Oh, did you?' 'I've been there.' — 'Have you?'","Заполнители паузы спасают от тишины: Well… / Let me think… / That's a good question… Они дают 3 секунды.","Правило трёх: вопрос → ответ → уточняющий вопрос. Без третьего шага разговор умирает."],"rulesB":["Косвенный вопрос вежливее: Could you tell me where the station is? Порядок слов прямой, без do/does.","Do you know if…? — когда нет вопросительного слова: Do you know if the bus stops here?","Частая ошибка: Could you tell me where is it — неверно. …where it is.","В разговоре косвенные вопросы снижают давление: I was wondering if you could help me."],"examples":["You've been here before, haven't you? — Yes, twice.","'I used to work nights.' — 'Oh, did you? What was that like?'","That's a good question. Let me think for a second."],"text":{"title":"The ten-minute rule","words":220,"body":["My English was good enough for work long before it was good enough for a coffee break.","In meetings I was fine. There was a topic, an agenda, and my turn to speak. Then everybody stood up, walked to the kitchen, and I lost the ability to form sentences.","The problem wasn't vocabulary. It was that I answered questions and stopped. 'Did you have a good weekend?' 'Yes, thank you.' Silence. 'Nice weather.' 'Yes.' Silence.","A colleague from Ireland gave me the only advice that worked. She said: 'Never give the last sentence. Always hand it back.'","So I started adding one thing to every answer, and then a question. 'Yes, good — I finally went to that market everybody talks about. Have you been?'","It felt mechanical for about two weeks. Then it became normal.","The second trick she gave me was the echo. Somebody says 'I used to live in Germany' and you say 'Oh, did you?' That's it. Two words, and the person talks for another minute.","My grammar hasn't changed much since then. My coffee breaks have changed completely."]},"textQs":["1. Where was the writer's English fine, and where did it fail?","2. What was the real problem — vocabulary or something else?","3. What advice did the Irish colleague give?","4. Explain the 'echo' trick with an example.","5. What does the last sentence mean?","6. Which of your conversations in English die fastest? Why?"],"opinions":{"title":"Что спасает разговор: четыре ответа","lines":["DINA: Follow-up questions. Always one more. 'Why that city?' 'What was that like?' People love talking about themselves.","MARAT: Honestly, silence. I used to panic and fill every pause. Now I wait two seconds and the other person continues.","AIDA: Saying 'I don't know, what do you think?' That's not weakness, that's a gift to the other person.","BEK: Having three topics ready before the event. It sounds strange, but it works for me every time."],"tasks":["1. Who prepares in advance?","2. Whose advice is to do less, not more?","3. Find one follow-up question in the comments.","4. Write your own line about what saves your conversations."]},"audio":{"type":"Listen: a conversation that works","script":"A: So, how was your weekend? B: Good, thanks. I finally went to that mountain lake everybody talks about. A: Oh, did you? What was it like? B: Colder than I expected. We swam for about four minutes and then sat in the sun for two hours. A: Four minutes! Was it worth the drive? B: Honestly, yes. The drive is three hours but the last part is beautiful. Have you been? A: Never. I keep saying I will. B: You should go in September — fewer people. A: Speaking of September, are you taking any holiday? B: Two weeks. I haven't decided where yet.","note":"Читай в два голоса, живо. Два раза. Студент считает уточняющие вопросы.","tasks":["1. Where did B go at the weekend?","2. How long did they swim, and how long did they sit in the sun?","3. How long is the drive?","4. What does B recommend about September?","5. How does A change the subject?","6. Сколько уточняющих вопросов задал A? Выпиши их."],"answers":"1 На горное озеро. · 2 Четыре минуты плавали, два часа сидели на солнце. · 3 Три часа. · 4 Ехать в сентябре — меньше людей. · 5 «Speaking of September…» · 6 Четыре: Oh, did you? What was it like? Was it worth the drive? Are you taking any holiday?"},"dialogue":{"title":"Coffee break","setting":"Bek (B) и новая коллега Elena (E) на кухне офиса.","lines":[["B","You're the new designer, aren't you?"],["E","I am, yes. Started on Monday."],["B","How's it going so far?"],["E","Good. Everyone's been really helpful, actually."],["B","That's good to hear. Where were you before?"],["E","At a small agency in Almaty. I was there for five years."],["B","Oh, were you? Five years is a long time. What made you leave?"],["E","Honestly, I stopped learning. Same clients, same work."],["B","I know that feeling. Same here, actually — that's why I moved."],["E","Did you? From where?"],["B","From a bank. Don't ask me about the bank."],["E","Now I have to ask about the bank."],["B","Three years of meetings about meetings."],["E","That sounds… efficient."],["B","Speaking of efficient, the coffee machine here takes four minutes. That's your first warning."],["E","Four minutes! Is it at least good coffee?"],["B","No. But we've all got used to it, haven't we?"]],"tasks":["Прочитай диалог вслух за обе роли.","Найди два question tag, три эхо-вопроса и один способ сменить тему.","Переиграй: знакомство на кофе-брейке, минимум 16 реплик, без односложных ответов.","Запиши себя за Bek — 90 секунд."]},"ex":[{"title":"Exercise 1. Добавь question tag.","items":["1. You're new here, ______?","2. She works in sales, ______?","3. They didn't come, ______?","4. You've been to Dubai, ______?","5. It isn't easy, ______?","6. We should leave now, ______?"]},{"title":"Exercise 2. Ответь эхо-вопросом и добавь уточняющий.","items":["1. «I used to live in Germany.» → ______","2. «I've just come back from Georgia.» → ______","3. «I don't drink coffee.» → ______","4. «I worked nights for two years.» → ______","5. «I'm learning Spanish.» → ______"]},{"title":"Exercise 3. Переделай односложный ответ в живой.","items":["Образец: «Did you have a good weekend?» → «Yes.» → «Yes, really good — I finally went hiking. Do you ever go?»","1. «Do you like your job?» → «Yes.» → ______","2. «Is it cold outside?» → «Yes.» → ______","3. «Have you been to Istanbul?» → «No.» → ______","4. «Do you have plans for the weekend?» → «Not really.» → ______"]}],"speaking":["Ten minutes, no silence: разговор на десять минут. Пауза дольше пяти секунд — начинаем заново. Главное задание курса.","Echo drill: преподаватель делает двадцать заявлений, студент на каждое отвечает эхо-вопросом плюс уточняющим.","No one-word answers: на любой вопрос минимум три предложения и возврат вопроса.","Topic switch: разговор, в котором студент обязан плавно сменить тему четыре раза, используя Speaking of… / That reminds me…"],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. You're new here, ______?","2. She works in sales, ______?","3. They didn't come, ______?","4. «I used to live in Germany.» → «Oh, ______ you?»","5. «I've been there.» → «______ you?»","6. Переведи: неловкая пауза — ______","7. Переведи: уточняющий вопрос — ______","8. Переведи: сменить тему — ______","9. Переведи: перебивать — ______","10. Исправь: Could you tell me where is the station? → ______"],"a":"1 aren't you · 2 doesn't she · 3 did they · 4 did · 5 Have · 6 awkward silence · 7 follow-up question · 8 change the subject · 9 interrupt · 10 Could you tell me where the station is?"},{"t":"Test 2 · фразовые глаголы","items":["1. People ______ when you listen. (open up)","2. Sorry to ______. (cut in)","3. ______, I'm listening. (Go on)","4. The conversation ______. (dried up)","5. Let's ______ next week. (catch up)","6. Переведи: разговорчивый — ______","7. Переведи: иметь общее — ______","8. Переведи: завершать (разговор) — ______","9. Переведи: уйти от темы — ______","10. Переведи: звучать заинтересованно — ______"],"a":"1 open up · 2 cut in · 3 Go on · 4 dried up · 5 catch up · 6 talkative · 7 have something in common · 8 wrap up · 9 go off topic · 10 sound interested"},{"t":"Test 3 · Повторение: вопросы и вежливость (уроки 9, 14, 15)","items":["1. Could you tell me where the station ______?","2. Do you know ______ this bus goes to the airport?","3. ______ you repeat that, please?","4. Where ______ you work before?","5. ______ you live near here? (Do / Are)","6. Are you new? — Yes, I ______.","7. Переведи: кстати — ______","8. Переведи: а вы? — ______","9. Переведи: поддерживать связь — ______","10. Напиши вежливую просьбу говорить медленнее: ______"],"a":"1 is · 2 if/whether · 3 Could · 4 did · 5 Do · 6 am · 7 by the way · 8 how about you? · 9 keep in touch · 10 Could you speak more slowly, please?"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать диалог на 20 реплик без единого односложного ответа.","Аудио: записать разговор с собой на 3 минуты — задавай вопрос, отвечай, задавай следующий. Без пауз."],"cando":["I can use question tags and echo questions.","I can ask follow-up questions automatically.","I can keep a conversation going for ten minutes."]},{"n":38,"en":"Final check 3","ru":"Итоговая проверка курса 3","goal":"I can hold a real conversation and I know my level.","goalRu":"Могу вести настоящий разговор и вижу свой уровень.","gramA":"Повторение всей грамматики уроков 27–37","gramB":"Повторение курсов 1 и 2","recycle":"Все уроки 1–37","starters":["Which lesson of this course changed something in how you speak?","What can you do in English now that you couldn't do six months ago?","What is still the hardest part for you?"],"vocab":[["fluency","беглость речи","Fluency is not the same as accuracy."],["accuracy","точность","Accuracy comes later."],["confidence","уверенность","My confidence has grown."],["progress","прогресс","I can see real progress."],["weak point","слабое место","Articles are my weak point."],["strength","сильная сторона","Listening is my strength."],["keep practising","продолжать практиковаться","Just keep practising."],["next level","следующий уровень","I'm ready for the next level."],["comfort zone","зона комфорта","Speaking is outside my comfort zone."],["take part in","участвовать в","I want to take part in a speaking club."],["express myself","выражать свои мысли","I can express myself more freely now."],["hold a conversation","поддерживать разговор","I can hold a conversation for ten minutes."],["be proud of","гордиться","I'm proud of this year."],["carry on learning","продолжать учиться","The plan is to carry on learning."]],"phrases":["Let me put it another way.","What I mean is…","I'm not sure how to say this, but…","Sorry, could you repeat that?","It's a thing you use for…","That's a good question.","I'd say the opposite, actually.","If I were you, I'd…","Speaking of which…","To cut a long story short…"],"pv":[["keep up","не отставать, поддерживать уровень","Keep up the practice."],["catch up","наверстать","I need to catch up on vocabulary."],["carry on","продолжать","Carry on, you're close."],["look back","оглядываться назад","When I look back, I see the difference."],["take up","начать заниматься","I'm going to take up a speaking club."]],"rulesA":["Шесть точек самопроверки: although/however · Past Continuous в истории · Present Perfect vs Past Simple · second conditional · reported speech · passive.","Главные ошибки уровня B1: 'when I will arrive', 'He said me', 'If I would have', 'I have worked there in 2022', 'The report sent'.","На экзамене оценивается не отсутствие ошибок, а способность выполнить задачу и восстановиться после ошибки.","Не знаешь слово — опиши: It's a thing you use for… Не понял — переспроси: Sorry, do you mean…?","Беглость — это решение продолжать говорить, а не отсутствие ошибок."],"rulesB":["Из курса 1: Present Simple, Past Simple, there is/are, сравнения, must/have to.","Из курса 2: Future Simple, Past Continuous, косвенные вопросы, Present Perfect с ever/already/yet.","Из курса 3: условные, косвенная речь, пассив, относительные придаточные, модальные предположения.","Всё это один язык, а не одиннадцать правил. В разговоре они идут вперемешку."],"examples":["I've worked here for three years. Before that I worked in a hotel, which is where I learned to deal with people.","If I were you, I'd ask him directly — he told me he wasn't sure about the dates.","The report is sent every Monday, and it was written by two people."],"text":{"title":"Twelve lessons later","words":215,"body":["Six months ago Aizada could tell you her name, her job and her city. Today she finished lesson thirty-eight.","Last week something happened that she didn't notice, and I did. A client called the office and the call was passed to her by mistake. She spoke for nine minutes. She disagreed with him twice, politely. She asked three follow-up questions. At the end she said, 'Let me check that and get back to you today.'","Then she put the phone down and carried on working. For her it was just a phone call.","A year ago that call would have ended in forty seconds with 'Sorry, one moment please' and a search for somebody else.","Her grammar is not perfect. She still says 'He said me' sometimes, and articles are a lifelong project. But nobody on that call heard a learner. They heard a person doing her job.","In December she has an interview for a position she wouldn't have applied for last year.","Will she get it? I don't know. But she'll walk in, sit down, and talk for forty minutes — and that is the part that used to be impossible."]},"textQs":["1. What could Aizada do six months ago?","2. What happened with the client's call?","3. Name four things she did during those nine minutes.","4. How would the same call have ended a year ago?","5. What does the writer mean by 'they heard a person doing her job'?","6. What is your own version of that nine-minute call?"],"opinions":{"title":"Четыре взгляда на прогресс","lines":["DINA: My grammar is still weak, but I stopped translating in my head. That's the whole change.","MARAT: I can hold a conversation now, however I still panic on the phone. Different skill.","AIDA: If I were starting again, I'd speak from week one instead of waiting until I felt ready.","BEK: I've been told my accent is strong. I've decided not to care. Nobody has ever misunderstood me."],"tasks":["1. Who distinguishes between two different skills?","2. Whose advice is about starting earlier?","3. Find one however, one second conditional and one passive.","4. Write your own line about your progress — two sentences."]},"audio":{"type":"Final listening test (10 баллов)","script":"Good afternoon, this is Elena Markova from Horizon Travel. I'm calling about the group booking for the twelfth of April. There's been a change: the hotel we booked has been sold and the new owners won't accept group bookings until June. I've found an alternative — it's a four-star hotel in the same district, two hundred metres from the beach, and the price is actually slightly lower. If you agree, the new confirmation will be sent today. I'd also like to ask whether you need airport transfers, because they're included in this hotel but they weren't in the last one. Could you call me back before five? My number is 0555 240 118.","note":"Читай два раза. По одному баллу за ответ.","tasks":["1. Who is calling, and from which company?","2. What date is the booking for?","3. What has happened to the original hotel?","4. Until when won't the new owners accept group bookings?","5. What are two facts about the alternative hotel?","6. What about the price?","7. What will be sent today if you agree?","8. What question does she ask about transfers?","9. By what time must you call back?","10. What is the phone number?"],"answers":"1 Elena Markova, Horizon Travel. · 2 12 апреля. · 3 Отель продан. · 4 До июня. · 5 Четыре звезды, в том же районе, 200 метров от пляжа. · 6 Немного ниже. · 7 Новое подтверждение. · 8 Нужны ли трансферы из аэропорта — здесь они включены, в прошлом отеле не были. · 9 До пяти. · 10 0555 240 118."},"dialogue":{"title":"Финальный устный экзамен — 5 карточек","setting":"Вытяни одну карточку. Без подготовки, 5 минут на карточку.","lines":[["Card A","OPINION. Преподаватель утверждает: «Remote work is bad for young professionals». Возрази, приведи два аргумента, признай один сильный момент оппонента и предложи компромисс."],["Card B","STORY. Расскажи историю о дне, когда всё пошло не так. Обязательно: фон в Past Continuous, неожиданный поворот, финал. Преподаватель будет перебивать уточняющими вопросами."],["Card C","ADVICE. У коллеги выгорание: он работает до девяти вечера и не может сказать «нет». Дай четыре совета разными конструкциями и ответь на его «That's easier said than done»."],["Card D","REPORT. Преподаватель играет клиента и говорит пять реплик. Перескажи их руководителю в косвенной речи, ничего не исказив."],["Card E","PROCESS. Объясни, как устроена твоя работа, в шесть шагов, используя пассив. Преподаватель задаёт «And what happens if that fails?»"]],"tasks":["Разыграй все пять карточек, записывая себя.","Прослушай записи и найди повторяющуюся ошибку — это твоя главная зона роста.","Перезапиши две самые слабые карточки.","Для каждой карточки выпиши пять фраз, которые точно понадобятся."]},"ex":[{"title":"PART A. Grammar mix (20 баллов).","items":["1. ______ the salary is low, I like the job. (Although)","2. I ______ (wait) when they announced the delay.","3. Have you ever ______ (work) abroad?","4. I ______ (work) in Turkey in 2021.","5. If I ______ (be) you, I'd take the job.","6. If it ______ (rain), we will stay at home.","7. You'd ______ leave now or you'll miss it. (better)","8. He's the man ______ helped me.","9. It's a café ______ opens at seven.","10. That's the town ______ I grew up.","11. 'I work here.' → He said he ______ there.","12. 'Are you free?' → She asked ______ I was free.","13. Every item ______ (check) twice.","14. This house ______ (build) in 1974.","15. He left an hour ago. He ______ be home. (must)","16. That ______ be right — the shop is closed.","17. You're new here, ______?","18. I'll call you when I ______ (arrive).","19. I have ______ sent it. (already)","20. Could you tell me where the station ______?"]},{"title":"PART B. Vocabulary (20 баллов). Напиши по-английски.","items":["1. по-моему ___   2. это зависит ___   3. вдруг ___   4. оказалось ___   5. пока что ___","6. передумать ___   7. на твоём месте ___   8. перегруженный ___   9. выгореть ___   10. щедрый ___","11. упрямый ___   12. предупредить ___   13. поставщик ___   14. вручную ___   15. стереотип ___","16. обидеть ___   17. неловкая пауза ___   18. уточняющий вопрос ___   19. беглость ___   20. зона комфорта ___"]},{"title":"PART C. Writing (10 баллов). Напиши 180 слов.","items":["Тема: «The best decision I've made in the last two years».","Обязательно: одно second conditional, одно however или although, одно относительное придаточное, одно предложение в косвенной речи."]}],"speaking":["PART D. Устный экзамен (40 баллов, 20 минут). Часть 1 — интервью: 10 вопросов о работе, опыте, планах, мнениях.","Часть 2 — ролевая карточка A–E без подготовки.","Часть 3 — монолог 3 минуты: «My English: where I started, where I am, where I'm going».","Критерии: беглость 8 · лексика 8 · грамматика 8 · произношение 8 · решение задачи 8."],"tests":[{"t":"Test 1 · грамматика и слова","items":["Итоговый тест вынесен в PART A, B, C выше."],"a":"PART A: 1 Although · 2 was waiting · 3 worked · 4 worked · 5 were · 6 rains · 7 better · 8 who/that · 9 which/that · 10 where · 11 worked · 12 if/whether · 13 is checked · 14 was built · 15 must · 16 can't · 17 aren't you · 18 arrive · 19 already · 20 is."},{"t":"Test 2 · фразовые глаголы","items":["См. PART B выше."],"a":"PART B: 1 in my opinion · 2 it depends · 3 suddenly · 4 it turned out · 5 so far · 6 change my mind · 7 if I were you · 8 overwhelmed · 9 burn out · 10 generous · 11 stubborn · 12 warn · 13 supplier · 14 by hand · 15 stereotype · 16 offend · 17 awkward silence · 18 follow-up question · 19 fluency · 20 comfort zone."},{"t":"Test 3 · Итоговый балл","items":["Grammar 20 + Vocabulary 20 + Writing 10 + Listening 10 + Speaking 40 = 100 баллов.","85–100 — уверенный B1, готов к B1+/B2 и к собеседованию на английском.","70–84 — крепкий B1. Цель курса достигнута.","55–69 — B1 в процессе. Повторить уроки 29, 31, 34, 35.","0–54 — вернуться к урокам 27–32 и пересдать через три недели."],"a":"Оценивает преподаватель по критериям устной части."}],"hw":["Подготовить и записать все пять ролевых карточек.","Написать письмо себе через год: что изменилось в английском и что дальше — 180 слов.","Выбрать следующий шаг: разговорный клуб, экзамен или специализация."],"cando":["I can hold a ten-minute conversation on an unfamiliar topic.","I can give an opinion, tell a story, give advice and report what others said.","I know my level and my next step."]}];

 {k:"phr",   ic:"⚡", t:"Фразы", d:"Произнеси вслух и отметь. Это то, что отличает B1 от A2."},
 {k:"pv",    ic:"🔗", t:"Phrasal verbs", d:"Пять глаголов. На каждый — своё предложение."},
 {k:"gramA", ic:"📐", t:"Грамматика A", d:"Нажимай на правило, чтобы раскрыть пример."},
 {k:"gramB", ic:"🔁", t:"Повторение", d:"Это уже проходили. Быстро и сразу в речь."},

 {k:"qs",    ic:"❓", t:"Вопросы", d:"Отвечай полными предложениями. Последний вопрос — на мнение."},

 {k:"ex",    ic:"✏️", t:"Упражнения", d:"Сначала устно, потом впиши ответ."},
 {k:"sp",    ic:"🎤", t:"Речь", d:"Главный блок урока. У каждого задания свой таймер."},
 {k:"test",  ic:"🎯", t:"Тесты", d:"Три теста по десять баллов."},
