<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Speak Up! · Интерактивные уроки 27–38</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --ink:#10211D; --mut:#5A716B; --line:#DCE9E5;
  --bg:#F4F8F6; --card:#FFFFFF; --soft:#F0F7F4;
  --brand:#0D6E63; --brand-d:#073F39; --brand-l:#E3F2EE;
  --lime:#9BD64A; --amber:#F0A830; --coral:#E8654F; --violet:#6C5CE7;
  --ok:#17875A; --ok-bg:#E4F5EC;
  --r:18px; --sh:0 1px 2px rgba(16,33,29,.05), 0 10px 30px rgba(16,33,29,.07);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme: dark;
  --ink:#E9F2EF; --mut:#9DB3AD; --line:#263934;
  --bg:#0A1412; --card:#13211E; --soft:#172824;
  --brand:#4FC0B0; --brand-d:#061210; --brand-l:#14302B;
  --ok:#5FD197; --ok-bg:#10281D;
  --sh:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#E9F2EF; --mut:#9DB3AD; --line:#263934;
  --bg:#0A1412; --card:#13211E; --soft:#172824;
  --brand:#4FC0B0; --brand-d:#061210; --brand-l:#14302B;
  --ok:#5FD197; --ok-bg:#10281D;
}
*{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:Outfit,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:60}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:700;margin:0}
button{font:inherit;cursor:pointer;border:none;background:none;color:inherit}

/* ===== ВЕРХНЯЯ ПАНЕЛЬ ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);
  border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:10px 14px}
.logo{font-family:Fraunces,serif;font-weight:700;color:var(--brand);font-size:17px;white-space:nowrap}
.logo span{color:var(--amber)}
.top .ttl{flex:1;min-width:0;font-size:14px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ic{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);display:flex;
  align-items:center;justify-content:center;font-size:16px;flex:none;background:var(--card)}
.ic:hover{border-color:var(--brand)}
.ic.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* ===== ЭКРАН ВЫБОРА УРОКА ===== */
.picker{padding:22px 14px 50px;max-width:1040px;margin:0 auto}
.hero2{background:linear-gradient(135deg,var(--brand-d),var(--brand));color:#fff;border-radius:26px;
  padding:30px 26px;position:relative;overflow:hidden;margin-bottom:22px}
.hero2 h1{font-size:30px;line-height:1.1;margin-bottom:8px}
.hero2 p{margin:0;color:#BFE4DD;font-size:15px;max-width:560px}
.hero2 .dot{position:absolute;border-radius:50%;opacity:.25}
.d1{width:180px;height:180px;background:var(--lime);right:-40px;top:-60px}
.d2{width:120px;height:120px;background:var(--amber);right:70px;bottom:-70px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(228px,1fr));gap:13px}
.lcard{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;
  text-align:left;box-shadow:var(--sh);transition:.15s;display:flex;flex-direction:column;gap:7px;min-height:150px}
.lcard:hover{transform:translateY(-3px);border-color:var(--brand)}
.lnum{width:34px;height:34px;border-radius:11px;background:var(--brand-l);color:var(--brand);
  font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.lcard h3{font-size:17.5px;line-height:1.2}
.lcard .lru{font-size:13px;color:var(--mut);flex:1}
.lcard .lg{font-size:11.5px;color:var(--amber);font-weight:600;border-top:1px solid var(--line);padding-top:7px}

/* ===== УРОК ===== */
.wrap{display:none;max-width:1040px;margin:0 auto;padding:0 14px 110px}
.wrap.on{display:block}
.rail{display:flex;gap:7px;overflow-x:auto;padding:12px 0 4px;scrollbar-width:none;position:sticky;
  top:calc(env(safe-area-inset-top,0px) + 57px);background:var(--bg);z-index:40}
.rail::-webkit-scrollbar{display:none}
.rb{white-space:nowrap;padding:7px 13px;border-radius:999px;border:1px solid var(--line);
  font-size:13.5px;font-weight:500;color:var(--mut);background:var(--card);flex:none}
.rb.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.rb.done{border-color:var(--ok);color:var(--ok)}
.sec{display:none;animation:in .25s ease}
.sec.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.sh{display:flex;align-items:center;gap:11px;margin:16px 0 4px}
.sh .chip{background:var(--amber);color:#2A1A05;font-size:11px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 10px;border-radius:999px}
.sh h2{font-size:25px;flex:1}
.sd{color:var(--mut);font-size:14px;margin:0 0 14px}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:17px;
  margin-bottom:11px;box-shadow:var(--sh)}
.card.soft{background:var(--soft)}
.q-row{display:flex;gap:12px;align-items:flex-start}
.q-n{width:28px;height:28px;border-radius:9px;background:var(--brand-l);color:var(--brand);
  font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.q-t{flex:1;font-size:16.5px}

/* таймер */
.timer{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.tbtn2{background:var(--brand);color:#fff;border-radius:11px;padding:8px 14px;font-size:14px;font-weight:600}
.tbtn2.alt{background:var(--card);color:var(--brand);border:1.5px solid var(--brand)}
.clock{font-family:Fraunces,serif;font-size:27px;font-weight:700;color:var(--brand);min-width:72px}
.clock.run{color:var(--amber)}
.clock.end{color:var(--coral)}

/* флеш-карточки */
.fc-wrap{display:flex;flex-direction:column;align-items:center;gap:14px}
.fc{width:100%;max-width:520px;height:220px;perspective:1200px;cursor:pointer}
.fc-in{position:relative;width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .fc-in{transform:rotateY(180deg)}
.fc-f,.fc-b{position:absolute;inset:0;backface-visibility:hidden;border-radius:22px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:22px;text-align:center}
.fc-f{background:var(--card);border:2px solid var(--line);box-shadow:var(--sh)}
.fc-b{background:var(--brand);color:#fff;transform:rotateY(180deg)}
.fc-w{font-family:Fraunces,serif;font-size:31px;font-weight:700;line-height:1.1}
.fc-ex{font-size:14.5px;color:var(--mut);font-style:italic}
.fc-b .fc-ex{color:#C7E8E2}
.fc-hint{font-size:12px;color:var(--mut);letter-spacing:.05em;text-transform:uppercase}
.fc-ctl{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.fcb{border-radius:12px;padding:10px 18px;font-size:14.5px;font-weight:600;border:1.5px solid var(--line);background:var(--card)}
.fcb.yes{border-color:var(--ok);color:var(--ok)}
.fcb.no{border-color:var(--coral);color:var(--coral)}
.fc-bar{width:100%;max-width:520px;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.fc-bar i{display:block;height:100%;background:var(--lime);transition:width .3s}

/* список фраз */
.ph{display:flex;align-items:center;gap:11px;padding:12px 14px;border:1px solid var(--line);
  border-radius:13px;margin-bottom:8px;background:var(--card);font-size:15.5px}
.ph .mark{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.ph.said .mark{background:var(--ok);border-color:var(--ok);color:#fff}
.ph.said{opacity:.55}

/* аккордеон правил */
.acc{border:1px solid var(--line);border-radius:14px;margin-bottom:9px;overflow:hidden;background:var(--card)}
.acc-h{display:flex;align-items:center;gap:11px;padding:14px 15px;width:100%;text-align:left;font-size:15.5px;font-weight:500}
.acc-h .ix{width:26px;height:26px;border-radius:8px;background:var(--amber);color:#2A1A05;
  font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;flex:none}
.acc-h .arr{margin-left:auto;color:var(--mut);transition:.2s}
.acc.open .arr{transform:rotate(180deg)}
.acc-b{display:none;padding:0 15px 15px 52px;font-size:15px;color:var(--ink)}
.acc.open .acc-b{display:block}

/* текст */
.reader{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;
  box-shadow:var(--sh);font-size:17px;line-height:1.72}
.reader p{margin:0 0 14px}
.reader p:last-child{margin:0}
.reader.big{font-size:19.5px;line-height:1.8}
.rtools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rt{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;background:var(--card)}
.rt.on{background:var(--brand);color:#fff;border-color:var(--brand)}

/* мнения */
.op{border:1px solid var(--line);border-radius:15px;padding:15px;margin-bottom:10px;background:var(--card)}
.op .who{font-weight:700;color:var(--brand);font-size:14px;margin-bottom:5px}
.op .vote{display:flex;gap:8px;margin-top:11px}
.vb{padding:7px 14px;border-radius:999px;border:1.5px solid var(--line);font-size:13.5px;font-weight:600}
.vb.a.on{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.vb.d.on{background:#FDECE9;border-color:var(--coral);color:var(--coral)}
:root[data-theme="dark"] .vb.d.on{background:#2E1718}

/* диалог */
.dlg{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--card)}
.dline{display:flex;gap:12px;padding:12px 15px;border-bottom:1px solid var(--line);font-size:15.5px}
.dline:last-child{border-bottom:none}
.dline:nth-child(even){background:var(--soft)}
.dwho{font-weight:700;color:var(--brand);min-width:56px;flex:none}
.dtxt{flex:1}
.dline.hid .dtxt{color:transparent;background:repeating-linear-gradient(90deg,var(--line) 0 60%,transparent 60% 100%);
  background-size:14px 2px;background-repeat:repeat-x;background-position:0 55%;border-radius:4px;cursor:pointer;min-height:22px}
.dline.hid .dtxt::after{content:"нажми, чтобы открыть";font-size:12px;color:var(--mut);display:block}

/* упражнения и тесты */
.ex-i{padding:12px 0;border-bottom:1px dashed var(--line);font-size:15.5px}
.ex-i:last-child{border-bottom:none}
.ex-i input{width:100%;margin-top:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;
  background:var(--soft);color:var(--ink);font:inherit;font-size:15px}
.ex-i input:focus{outline:none;border-color:var(--brand)}
.key{display:none;margin-top:12px;background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px}
.key.on{display:block}

/* speaking */
.sp{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:11px;background:var(--card)}
.sp .spn{display:inline-flex;width:26px;height:26px;border-radius:50%;background:var(--coral);color:#fff;
  font-size:13px;font-weight:700;align-items:center;justify-content:center;margin-right:9px}

/* нижняя навигация */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:55;background:var(--card);border-top:1px solid var(--line);
  padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));display:none;gap:10px;align-items:center}
.nav.on{display:flex}
.nb{flex:1;max-width:160px;padding:12px;border-radius:13px;font-size:15px;font-weight:600;
  border:1.5px solid var(--line);text-align:center}
.nb.main{background:var(--brand);color:#fff;border-color:var(--brand)}
.nb:disabled{opacity:.35}
.pbar{flex:1;height:6px;background:var(--line);border-radius:999px;overflow:hidden}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--lime));transition:width .3s}

.tnote{background:var(--brand-l);border-radius:13px;padding:12px 14px;font-size:14px;color:var(--brand);margin-bottom:12px;display:none}
.tnote.on{display:block}
.cando{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);
  border-radius:14px;margin-bottom:9px;background:var(--card);font-size:16px}
.cando .cb{width:26px;height:26px;border-radius:9px;border:2px solid var(--line);flex:none;
  display:flex;align-items:center;justify-content:center;color:transparent;font-size:15px}
.cando.yes .cb{background:var(--lime);border-color:var(--lime);color:#143005}
@media(max-width:620px){
  .hero2 h1{font-size:24px}.sh h2{font-size:21px}.fc{height:195px}.fc-w{font-size:26px}
  .reader{font-size:16px;padding:17px}.reader.big{font-size:18px}
}
</style>
</head>
<body>

<div class="top">
  <div class="logo">Speak<span>Up!</span></div>
  <div class="ttl" id="ttl">Выбери урок</div>
  <button class="ic" id="home" title="К списку уроков">☰</button>
  <button class="ic" id="tmode" title="Режим преподавателя">🔑</button>
  <button class="ic" id="theme" title="Тема">◐</button>
</div>

<div class="picker" id="picker">
  <div class="hero2">
    <div class="dot d1"></div><div class="dot d2"></div>
    <h1>Speak Up! · Part 3</h1>
    <p>Двенадцать интерактивных уроков уровня B1. Флеш-карточки, таймеры речи, диалог со скрытой ролью. Выбери урок и нажми на карточку.</p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<div class="wrap" id="wrap">
  <div class="rail" id="rail"></div>
  <div id="body"></div>
</div>

<div class="nav" id="nav">
  <button class="nb" id="prev">← Назад</button>
  <div class="pbar"><i id="pb"></i></div>
  <button class="nb main" id="next">Дальше →</button>
</div>

<script>
const L = [{"n":27,"en":"What do you think?","ru":"Мнение: согласие и несогласие","goal":"I can give my opinion, agree and disagree politely.","goalRu":"Могу высказать мнение, согласиться и возразить вежливо.","gramA":"Выражение мнения · although / however / on the other hand","gramB":"Повторение: Present Simple vs Present Continuous (уроки 3, 14)","recycle":"Уроки 3, 14, 22 — настоящее время, small talk, характер","starters":["Is it better to work from home or in an office? Why?","Do you change your opinion easily, or do you usually stand your ground?","When was the last time you disagreed with your manager? What happened?"],"vocab":[["in my opinion","по-моему","In my opinion, it's a bad idea."],["it depends","это зависит","It depends on the situation."],["point of view","точка зрения","I see your point of view."],["argue","спорить","We argued about the price."],["agree / disagree","соглашаться / не соглашаться","I disagree with that."],["reason","причина","What is the main reason?"],["advantage / disadvantage","плюс / минус","Every job has advantages."],["admit","признавать","I admit I was wrong."],["convince","убедить","He convinced me in two minutes."],["obvious","очевидный","The answer is obvious."],["waste of time","пустая трата времени","That meeting was a waste of time."],["make sense","иметь смысл","That doesn't make sense to me."],["strongly believe","твёрдо считать","I strongly believe this is wrong."],["see your point","понимаю твою мысль","I see your point, but…"]],"phrases":["What do you think about…?","In my opinion / If you ask me…","I totally agree with you.","I'm not sure I agree.","That's a good point, but…","I see what you mean, however…","It depends on the situation.","Exactly! That's what I think too.","I'd say the opposite, actually.","Let's agree to disagree."],"pv":[["bring up","поднять тему","Don't bring up politics at dinner."],["back down","отступить в споре","He never backs down."],["point out","указать, заметить","She pointed out one small mistake."],["stick to","придерживаться","Let's stick to the main question."],["talk over","обсудить","Let's talk it over tomorrow."]],"rulesA":["Начало мнения: I think… / In my opinion… / If you ask me… / Personally, I…","Мягкое несогласие — главный навык вежливого спора: I see your point, but… / I'm not sure I agree. Прямое You are wrong звучит грубо.","although — хотя (внутри предложения): Although the salary is low, I like the job.","however — однако (новое предложение, с запятой): The salary is low. However, I like the job.","on the one hand… on the other hand — с одной стороны… с другой: On the one hand it's cheaper, on the other hand it's slower."],"rulesB":["Present Simple — мнение и факт: I think, I agree, she works here.","Глаголы мнения не идут в Continuous: I'm thinking it's wrong — неверно. I think it's wrong.","НО: I'm thinking about it = размышляю (процесс) — здесь Continuous возможен.","Present Continuous — то, что меняется сейчас: More and more people are working from home."],"examples":["In my opinion, remote work is better. Although I miss the team, I work faster at home.","I see your point, however the client prefers face-to-face meetings.","It depends. On the one hand it's cheaper, on the other hand it takes more time."],"text":{"title":"The meeting that didn't need to happen","words":215,"body":["Last year my company decided that every team must have a meeting every Monday morning. One hour, everybody, no exceptions.","At first I thought it was a good idea. Then I counted. Twelve people, one hour, every week. That is twelve hours of work time, and in a year — more than five hundred hours.","I brought it up with my manager. I was nervous, because in our office nobody argues with the boss. I said, 'I see the point of these meetings, however I think we only need them when something changes.'","She didn't back down immediately. She pointed out that meetings help new people. That was a good point, and I admitted it.","So we made a deal. Monday meetings became fifteen minutes, and only for problems. For everything else we use a short message.","Six months later nobody wants the old system back. Not even my manager.","I learned something that year. In most offices people don't disagree because they are afraid of the word 'no'. But disagreeing is not the same as fighting. You can say 'I see your point, but…' and still keep a good relationship.","The problem is rarely the opinion. The problem is how you say it."]},"textQs":["1. What did the company decide, and how did the writer feel at first?","2. What did he calculate, and what number shocked him?","3. What was the manager's good point?","4. What was the final deal?","5. What does the writer mean by 'disagreeing is not the same as fighting'?","6. Do people in your workplace disagree openly? Why or why not?"],"opinions":{"title":"Четыре мнения в рабочем чате","lines":["AIDA: Honestly, meetings are a waste of time. We could do everything by message.","MARAT: I don't agree. When I'm new, a meeting is the only way to understand who does what.","DINA: It depends on the team. Our team is small, so we don't need them. A big team is different.","BEK: I see your point, however short meetings are fine. It's the one-hour ones that kill the day."],"tasks":["1. Who is completely against meetings?","2. Who thinks it depends on the size of the team?","3. Which opinion is closest to yours? Write two sentences with your reason.","4. Reply to Aida — agree or disagree politely in two sentences."]},"audio":{"type":"Listen: a disagreement","script":"A: So, what do you think about the new schedule? B: Honestly, I'm not a fan. Starting at eight is too early for me. A: Really? I'd say the opposite. I finish at five now and I have the whole evening. B: That's a good point. But I live forty minutes away, so I have to get up at six. A: Hmm, I see what you mean. Maybe we could ask for a flexible start — eight or nine, your choice. B: Now that makes sense. Let's bring it up at the meeting on Friday.","note":"Читай в два голоса, меняя темп. Два раза. Студент слушает, не читая.","tasks":["1. What are they talking about?","2. Why doesn't B like the new schedule?","3. What is A's reason for liking it?","4. What solution do they find?","5. When will they discuss it?","6. Write down two phrases of polite disagreement that you heard."],"answers":"1 Новое расписание. · 2 Начало в восемь слишком рано, он живёт в сорока минутах. · 3 Заканчивает в пять, свободен весь вечер. · 4 Попросить гибкое начало — восемь или девять на выбор. · 5 На встрече в пятницу. · 6 I'm not a fan / I'd say the opposite / That's a good point, but / I see what you mean."},"dialogue":{"title":"Office or home?","setting":"Erlan (E) и Dina (D) спорят за обедом.","lines":[["E","Dina, can I ask you something? Would you go back to the office full-time?"],["D","Honestly? No. In my opinion, working from home is better in every way."],["E","In every way? I'm not sure I agree."],["D","Why not? No commute, no noise, I start when I want."],["E","That's a good point about the commute. However, I learn more in the office."],["D","How do you mean?"],["E","When I sit next to Marat, I hear how he talks to clients. At home I only hear myself."],["D","Hmm. I see what you mean, actually."],["E","And new people? It took me a month to learn everybody's name, and I was in the office."],["D","OK, I admit that. For new people it's different."],["E","So maybe it depends on the person, not on the system."],["D","That makes sense. Two days in the office, three at home?"],["E","I'd say the opposite — three in the office, two at home. But we're close."],["D","Let's agree to disagree on the numbers."],["E","Deal. Shall we bring it up with the manager together?"],["D","Now that's a good idea."]],"tasks":["Прочитай диалог вслух за обе роли.","Выпиши все фразы согласия и несогласия — их девять.","Переиграй спор на другую тему: кофе или чай на работе, машина или автобус.","Запиши себя за Erlan — 90 секунд."]},"ex":[{"title":"Exercise 1. although или however?","items":["1. ______ the salary is low, I like the team.","2. The salary is low. ______, I like the team.","3. ______ I was tired, I finished the report.","4. He speaks fast. ______, I understand him.","5. ______ it's expensive, it's worth it."]},{"title":"Exercise 2. Ответь вежливо несогласием. Начни с указанной фразы.","items":["1. «Meetings are a waste of time.» → I see your point, but ______","2. «English grammar is the most important thing.» → I'm not sure I agree, because ______","3. «Everybody should work from home.» → That's a good point, however ______","4. «Money is the only reason to change jobs.» → I'd say the opposite — ______","5. «Reading is better than listening.» → It depends — ______"]},{"title":"Exercise 3. Simple или Continuous?","items":["1. I ______ (think) you are right.","2. I ______ (think) about your offer — give me a day.","3. More people ______ (work) from home these days.","4. She ______ (not / agree) with the plan.","5. What ______ you ______ (do) right now?","6. I ______ (know) what you mean."]}],"speaking":["Debate 2×90: преподаватель называет утверждение («Working from home is better»), студент 90 секунд ЗА, потом 90 секунд ПРОТИВ. Менять позицию обязательно.","Polite no: преподаватель делает пять спорных заявлений, студент каждый раз возражает по-разному, не повторяя фразу.","Three opinions: высказать мнение о работе, о своём городе и об изучении английского — по 4 предложения, обязательно с although или however.","Convince me: студент за 2 минуты убеждает преподавателя попробовать что-то — блюдо, фильм, привычку."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. ______ the salary is low, I like the job. (Although / However)","2. I ______ you are right. (think / am thinking)","3. I see your ______, but I disagree. (point)","4. Переведи: это зависит — ______","5. Переведи: пустая трата времени — ______","6. She ______ (work) from home this week.","7. Переведи: признавать — ______","8. More people ______ (travel) by train these days.","9. ______ hand it's cheaper, on the other hand it's slow. (On the one)","10. Напиши вежливое несогласие одной фразой: ______"],"a":"1 Although · 2 think · 3 point · 4 it depends · 5 a waste of time · 6 is working · 7 admit · 8 are travelling · 9 On the one · 10 напр. I'm not sure I agree."},{"t":"Test 2 · фразовые глаголы","items":["1. Don't ______ politics at dinner. (bring up)","2. He never ______ in an argument. (backs down)","3. She ______ one small mistake. (pointed out)","4. Let's ______ the main question. (stick to)","5. Переведи: убедить — ______","6. Переведи: очевидный — ______","7. That doesn't ______ sense to me.","8. Переведи: точка зрения — ______","9. I ______ believe this is wrong. (strongly)","10. Переведи: плюсы и минусы — ______"],"a":"1 bring up · 2 backs down · 3 pointed out · 4 stick to · 5 convince · 6 obvious · 7 make · 8 point of view · 9 strongly · 10 advantages and disadvantages"},{"t":"Test 3 · Повторение: времена и вопросы (уроки 1–26)","items":["1. Where ______ you work?","2. She ______ (work) in a bank every day.","3. I ______ (go) to Osh last summer.","4. I ______ (work) when he called.","5. Have you ever ______ (work) abroad?","6. If it ______ (rain), we will stay at home.","7. You ______ take photos here. It's forbidden.","8. This hotel is ______ (cheap) than that one.","9. She works very ______ (careful).","10. I ______ call you tomorrow. (will)"],"a":"1 do · 2 works · 3 went · 4 was working · 5 worked · 6 rains · 7 mustn't · 8 cheaper · 9 carefully · 10 will"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 150 слов: «Working from home — advantages and disadvantages». Минимум два although и два however.","Аудио: записать 2 минуты — мнение о любой спорной теме, с аргументом и контраргументом."],"cando":["I can give my opinion with a reason.","I can disagree politely without sounding rude.","I can use although, however and on the other hand."]},{"n":28,"en":"Stories worth telling","ru":"Как рассказывать истории","goal":"I can tell a story about my past so people want to listen.","goalRu":"Могу рассказать историю из прошлого так, чтобы её было интересно слушать.","gramA":"Past Simple + Past Continuous + used to · слова-связки истории","gramB":"Повторение: неправильные глаголы (урок 5)","recycle":"Уроки 5, 18, 19 — прошедшее время и Past Continuous","starters":["What is the funniest thing that has happened to you at work?","Tell me about a day when everything went wrong.","Who in your family tells the best stories? What makes them good?"],"vocab":[["suddenly","вдруг","Suddenly the lights went off."],["at first","сначала","At first I didn't understand."],["in the end","в конце концов","In the end we took a taxi."],["it turned out","оказалось","It turned out he was right."],["by the time","к тому времени как","By the time we arrived, it was closed."],["luckily / unluckily","к счастью / к несчастью","Luckily, I had my passport."],["embarrassing","неловкий","It was the most embarrassing moment."],["scary","страшный","It was a scary situation."],["notice","замечать","I didn't notice the mistake."],["realise","осознать","I realised I had the wrong ticket."],["manage to","суметь","I managed to find the hotel."],["end up","в итоге оказаться","We ended up walking home."],["memory","воспоминание","It's my best childhood memory."],["unforgettable","незабываемый","It was an unforgettable trip."]],"phrases":["You'll never guess what happened.","It all started when…","At first I thought…","And then, suddenly…","The funny thing is…","To cut a long story short…","In the end everything was fine.","I'll never forget that day.","Luckily, somebody helped me.","That was the moment I realised…"],"pv":[["end up","в итоге оказаться","We ended up in the wrong city."],["turn out","оказаться","It turned out to be a good day."],["run into","случайно встретить","I ran into my old teacher."],["look back","оглядываться назад","When I look back, I laugh."],["go on","происходить","What was going on there?"]],"rulesA":["Фон истории — Past Continuous, события — Past Simple: I was waiting at the gate when they announced the delay.","used to — то, что было регулярно в прошлом, а сейчас нет: I used to work night shifts. Отрицание: I didn't use to (без d).","Слова-связки держат историю: First… Then… After that… Suddenly… In the end…","Усилители внимания: You'll never guess what happened. The funny thing is… To cut a long story short…","Хорошая история = фон + неожиданность + финал. Без неожиданности это не история, а отчёт."],"rulesB":["Вторые формы учить парами: go-went, buy-bought, take-took, fly-flew, see-saw, meet-met.","После did всегда первая форма: I didn't go (не didn't went).","Вопрос: Did you see him? — Yes, I did. Who saw him? — без did, потому что who и есть подлежащее.","Правильные глаголы: -ed. Произношение: /t/ worked · /d/ stayed · /ɪd/ wanted."],"examples":["I used to be afraid of flying. Then one day I had to fly to Dubai for work.","We were boarding when they suddenly closed the gate.","To cut a long story short, in the end we slept at the airport."],"text":{"title":"The wrong Almaty","words":225,"body":["A few years ago I had to fly to Almaty for a two-day training. I was tired, I booked the ticket late at night, and I didn't check it carefully.","On the morning of the flight everything was normal. I checked in, I bought coffee, I sat at the gate and read the news. While I was waiting, a woman next to me asked, 'Are you going to Aktau too?'","At first I laughed. Then I looked at my boarding pass.","Aktau. Not Almaty. Two thousand kilometres in the wrong direction.","I ran to the desk. The woman there was very calm. It turned out there was one seat on the Almaty flight, but it was leaving in twenty minutes from another terminal.","I managed to get there with four minutes to spare. I don't want to remember how I looked.","The funny thing is, I arrived in Almaty on time, and nobody at the training knew anything. I told the story only a year later.","When I look back now, I don't feel embarrassed. I feel lucky. If that woman hadn't asked me a simple question, I would have spent two days in a city with no training, no hotel and no idea what to do.","Now I check my ticket three times. And I always talk to people at the gate."]},"textQs":["1. Why didn't the writer check the ticket carefully?","2. What was he doing when the woman spoke to him?","3. What did he discover?","4. How much time did he have to spare?","5. Why does he feel lucky rather than embarrassed?","6. Tell a short story about a mistake you made while travelling."],"opinions":{"title":"Три коротких истории в чате группы","lines":["DINA: You'll never guess what happened. I was giving a presentation when my laptop died. I finished it from memory.","MARAT: I used to work night shifts. One morning I came home, went to bed, and woke up at 7 — in the evening. I was six hours late for my own birthday party.","AIDA: To cut a long story short: wrong hotel, same street name, different district. The receptionist knew my name anyway. It turned out my colleague was staying there."],"tasks":["1. Whose story is about technology?","2. Who was late for something personal?","3. Find one example of Past Continuous and one of used to.","4. Write your own three-line story using at least two linking words."]},"audio":{"type":"Listen: a story","script":"You'll never guess what happened to me last winter. I was driving to the airport at five in the morning. It was snowing and the road was empty. Suddenly my car stopped — no petrol. At first I thought, this is the end of my trip. Then a bus stopped behind me. The driver was going to the airport too, with no passengers. He took me for free. The funny thing is, he said he almost didn't stop because he thought I was waving at someone else. In the end I arrived forty minutes early.","note":"Читай живо, с паузами перед развязкой. Два раза.","tasks":["1. When and where was the writer driving?","2. What was the weather like?","3. What happened suddenly?","4. Who helped, and why was it lucky?","5. What did the driver almost do?","6. Did the writer miss the flight?"],"answers":"1 Last winter, to the airport at five in the morning. · 2 Снег, дорога пустая. · 3 Машина встала — кончился бензин. · 4 Водитель автобуса, который ехал в аэропорт пустым, подвёз бесплатно. · 5 Он чуть не проехал мимо — подумал, что машут не ему. · 6 Нет, приехал на сорок минут раньше."},"dialogue":{"title":"You'll never guess what happened","setting":"Aida (A) рассказывает, Bek (B) слушает и реагирует.","lines":[["A","Bek, you'll never guess what happened to me yesterday."],["B","Go on, I'm listening."],["A","So, it all started when I decided to walk to work instead of taking the bus."],["B","You? Walking? That's already a story."],["A","Very funny. So I was walking past the old market when I saw a man with a huge box."],["B","What kind of box?"],["A","That's the thing — I had no idea. He said, 'Excuse me, can you hold this for one minute?'"],["B","And you said yes? Aida!"],["A","I know, I know. At first I thought he was a delivery guy."],["B","So what was in it?"],["A","Puppies. Four of them."],["B","You're joking."],["A","I'm not. It turned out he was taking them to the vet and his phone was ringing."],["B","So you stood in the street holding a box of puppies."],["A","For eight minutes. In the end he came back, said thank you, and gave me a chocolate bar."],["B","And you were late for work."],["A","Twelve minutes late. Worth it."]],"tasks":["Прочитай диалог вслух за обе роли.","Выпиши все реакции слушателя — их пять. Без них история мёртвая.","Расскажи свою историю, а преподаватель будет реагировать. Потом наоборот.","Запиши себя за Aida — 90 секунд."]},"ex":[{"title":"Exercise 1. Past Simple или Past Continuous?","items":["1. I ______ (wait) at the gate when they ______ (announce) the delay.","2. While she ______ (drive), the phone ______ (ring).","3. We ______ (board) when the announcement ______ (start).","4. He ______ (not / listen) when I ______ (explain) the problem.","5. What ______ you ______ (do) at nine last night?","6. They ______ (have) dinner when the lights ______ (go) off."]},{"title":"Exercise 2. used to или Past Simple?","items":["1. I ______ (work) night shifts for two years, but now I don't.","2. Yesterday I ______ (work) until nine.","3. She ______ (be) afraid of flying, but now she loves it.","4. Last summer we ______ (fly) to Antalya.","5. I ______ (not / like) coffee when I was a child."]},{"title":"Exercise 3. Вставь связку: at first · suddenly · in the end · it turned out · by the time.","items":["1. ______ I thought he was joking.","2. ______ the lights went off and everybody screamed.","3. ______ he was right all along.","4. ______ we arrived, the shop was closed.","5. ______ we decided to take a taxi."]}],"speaking":["Two-minute story: расскажи историю о дне, когда всё пошло не так. Обязательно: фон в Past Continuous, suddenly, in the end.","Listener's job: преподаватель рассказывает, студент реагирует каждые 15 секунд — Really? / What happened then? / You're joking! Молчать нельзя.","Story from three words: преподаватель называет три слова (airport, rain, stranger), студент за минуту сочиняет историю.","Used to vs now: пять предложений о том, как ты изменился за пять лет."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. I ______ (wait) when they announced the delay.","2. While she ______ (drive), the phone rang.","3. I ______ to work night shifts, but now I don't. (used)","4. Переведи: вдруг — ______","5. Переведи: оказалось — ______","6. ______ the time we arrived, it was closed.","7. Переведи: в конце концов — ______","8. I ______ (manage) to find the hotel.","9. Переведи: неловкий — ______","10. Напиши начало истории одной фразой: ______"],"a":"1 was waiting · 2 was driving · 3 used · 4 suddenly · 5 it turned out · 6 By · 7 in the end · 8 managed · 9 embarrassing · 10 напр. You'll never guess what happened."},{"t":"Test 2 · фразовые глаголы","items":["1. We ______ walking home. (ended up)","2. I ______ my old teacher yesterday. (ran into)","3. It ______ to be a good day. (turned out)","4. When I ______, I laugh. (look back)","5. Переведи: замечать — ______","6. Переведи: осознать — ______","7. Переведи: незабываемый — ______","8. ______, I had my passport with me. (Luckily)","9. What was ______ on there? (go on)","10. Переведи: воспоминание — ______"],"a":"1 ended up · 2 ran into · 3 turned out · 4 look back · 5 notice · 6 realise · 7 unforgettable · 8 Luckily · 9 going · 10 memory"},{"t":"Test 3 · Повторение: неправильные глаголы и Past Simple (уроки 5, 12)","items":["1. go → ______   2. buy → ______   3. take → ______","4. fly → ______   5. see → ______   6. meet → ______","7. I ______ (not / go) to the party last night.","8. ______ you see him yesterday?","9. Who ______ (call) this morning?","10. She ______ (leave) the company in June."],"a":"1 went · 2 bought · 3 took · 4 flew · 5 saw · 6 met · 7 didn't go · 8 Did · 9 called · 10 left"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать историю на 180 слов: «The day everything went wrong». Минимум три слова-связки.","Аудио: рассказать историю за 2 минуты, без чтения с листа."],"cando":["I can tell a story with a beginning, a surprise and an end.","I can use Past Continuous as the background of a story.","I can react as a listener so the speaker continues."]},{"n":29,"en":"Have you ever…?","ru":"Опыт: что ты уже пробовал","goal":"I can talk about my experience and ask about other people's.","goalRu":"Могу говорить о своём опыте и расспрашивать о чужом.","gramA":"Present Perfect vs Past Simple · been / gone · just, already, yet","gramB":"Повторение: вопросы и короткие ответы (уроки 1, 14)","recycle":"Уроки 11, 24 — опыт, резюме, оффер","starters":["What is the most unusual food you have ever tried?","Have you ever done something you were afraid of? What happened?","What have you learned in the last year that changed something for you?"],"vocab":[["experience","опыт, впечатление","It was an amazing experience."],["try something new","попробовать новое","I try something new every month."],["so far","пока что, до сих пор","So far everything is fine."],["recently","недавно","I've recently changed jobs."],["abroad","за границей","Have you ever lived abroad?"],["achievement","достижение","That's a real achievement."],["regret","жалеть","I don't regret anything."],["chance / opportunity","шанс / возможность","I had the chance to travel."],["take a risk","рискнуть","Sometimes you have to take a risk."],["get used to","привыкнуть","I've got used to the new system."],["worth it","стоило того","It was hard, but it was worth it."],["a few times","несколько раз","I've done it a few times."],["never in my life","никогда в жизни","Never in my life have I been so tired."],["since then","с тех пор","Since then I've never missed a flight."]],"phrases":["Have you ever…?","Yes, I have. / No, I never have.","I've just finished…","I haven't done it yet.","It was the best thing I've ever done.","I've been meaning to try it.","How long have you been…?","That sounds amazing — tell me more.","I'd love to try that one day.","It's on my list."],"pv":[["take up","начать заниматься","I've taken up swimming."],["give up","бросить","I gave up coffee last year."],["get into","увлечься","She's got into photography."],["carry on","продолжать","I carried on even when it was hard."],["put off","откладывать","I've been putting it off for months."]],"rulesA":["Present Perfect — опыт без точного времени: I have flown business class. Вопрос: Have you ever…?","Как только появляется время — Past Simple: I flew business class in 2023. Это главная ошибка уровня B1.","Схема разговора: вопрос в Present Perfect → ответ Yes, I have → детали в Past Simple. Have you ever been to Dubai? — Yes, I have. I went there in 2022.","been vs gone: She has been to Dubai (была и вернулась) · She has gone to Dubai (уехала, сейчас там).","just — только что · already — уже · yet — ещё (в конце, в вопросе и отрицании): I've just finished. Have you finished yet?"],"rulesB":["Вопрос с Present Perfect: Have/Has + кто + V3. Have you seen it? Has she called?","Короткие ответы: Yes, I have. / No, I haven't. Не говорим Yes, I did.","Вопросительные слова: What have you done? How long have you worked here?","Who has been there? — без have+кто, потому что who и есть подлежащее."],"examples":["Have you ever worked at night? — Yes, I have. I did it for two years in a hotel.","I've just sent the email, but I haven't had an answer yet.","He's gone to Istanbul, so he isn't in the office today."],"text":{"title":"The list I was afraid of","words":220,"body":["Three years ago a friend asked me a simple question: 'What have you done that scared you this year?' I couldn't answer. Not one thing.","So I made a list of ten things I had never done and was afraid of. Some were small: speak on the phone in English, eat alone in a restaurant. Some were bigger: give a presentation, travel somewhere alone.","I've done eight of them so far.","The phone call was the hardest. I had worked in an office for six years and I had never called a foreign client. I prepared for twenty minutes and the call took four.","Eating alone turned out to be my favourite. I used to think everybody was looking at me. Nobody was. Everybody was eating.","Two things are still on the list. I haven't given a presentation in English yet, and I haven't travelled alone.","But something changed. Before, when I didn't know how to do something, I said 'I can't'. Now I say 'I haven't done it yet'. It's a small difference in words and a big difference in life.","My friend asked me the same question last month. This time I talked for ten minutes and she had to stop me."]},"textQs":["1. What question couldn't the writer answer three years ago?","2. Give two small items and two bigger items from the list.","3. Why was the phone call the hardest?","4. What did she discover about eating alone?","5. Explain the difference between 'I can't' and 'I haven't done it yet'.","6. What would be on your own list of ten things?"],"opinions":{"title":"Experience board — четыре ответа","lines":["BEK: I've never been abroad, but I've worked with people from nine countries. Does that count?","DINA: I've just taken up swimming at 34. The kids in my class are eight years old. Best decision this year.","AIDA: I gave up my job in March and I haven't regretted it for one day.","MARAT: I've been putting off my English exam for two years. I'm taking it in December. Probably."],"tasks":["1. Who has started a new hobby as an adult?","2. Who is still postponing something?","3. Find one Present Perfect and one Past Simple sentence and explain the difference.","4. Write your own line for this board — two sentences."]},"audio":{"type":"Listen: a job chat","script":"A: So, have you ever worked abroad? B: Yes, I have, actually. I worked in Turkey for eighteen months. A: Really? When was that? B: I went there in 2021, right after the pandemic. A: And have you ever thought about going back? B: I've thought about it a few times, but I haven't decided yet. My family is here. A: I understand. Have you been to Georgia? B: No, never. It's on my list. A: You should go. I've been three times and I'd go again tomorrow.","note":"Читай в два голоса, естественный темп. Два раза.","tasks":["1. Where did B work abroad, and for how long?","2. When exactly did B go?","3. Why hasn't B decided about going back?","4. Has B been to Georgia?","5. How many times has A been to Georgia?","6. Найди в тексте, где время меняется с Present Perfect на Past Simple, и объясни почему."],"answers":"1 В Турции, восемнадцать месяцев. · 2 В 2021 году, сразу после пандемии. · 3 Семья здесь. · 4 Нет, никогда — это в списке. · 5 Три раза. · 6 Have you ever worked abroad? → I worked in Turkey — как только называется период или время, нужен Past Simple."},"dialogue":{"title":"Three questions at a party","setting":"Nurbek (N) знакомится с Elena (E).","lines":[["N","So, Elena, have you always lived in this city?"],["E","No, I haven't. I moved here four years ago, from Osh."],["N","Oh nice. Have you ever thought about going back?"],["E","Honestly, a few times. But I've got used to the city now."],["N","I know that feeling. How long have you worked at the agency?"],["E","Since 2022. Three years in March."],["N","That's a long time. What's the best thing you've done there?"],["E","We opened an office in Almaty last year. I led the project."],["N","Wow. Have you been to Almaty many times, then?"],["E","Eleven times in one year. I've seen the airport more than my flat."],["N","And was it worth it?"],["E","It was hard, but yes. It was the best year of my career."],["N","Have you taken a holiday since then?"],["E","Not yet. I've been putting it off. What about you — have you travelled recently?"],["N","I've just come back from Georgia, actually."],["E","No way. That's on my list."]],"tasks":["Прочитай диалог вслух за обе роли.","Найди четыре места, где время меняется с Present Perfect на Past Simple. Объясни каждое.","Переиграй: ты знакомишься с человеком и задаёшь 6 вопросов Have you ever…?","Запиши себя за Elena — 90 секунд."]},"ex":[{"title":"Exercise 1. Present Perfect или Past Simple?","items":["1. I ______ (work) in three companies.","2. I ______ (work) in a hotel in 2022.","3. ______ you ever ______ (fly) business class?","4. She ______ (leave) her job last March.","5. We ______ (not / receive) your answer yet.","6. He ______ (just / call) me."]},{"title":"Exercise 2. been или gone?","items":["1. She has ______ to Dubai — she's there until Friday.","2. She has ______ to Dubai twice and she loved it.","3. Where have you ______? I called you three times.","4. He isn't here. He has ______ to the bank.","5. I have never ______ to Georgia."]},{"title":"Exercise 3. just, already или yet?","items":["1. Have you finished ______?","2. I have ______ sent the report — check your email.","3. She hasn't answered ______.","4. I've ______ come back from the airport. I'm still in the car.","5. We've ______ started the training, so you're late."]}],"speaking":["Twenty questions: студент задаёт преподавателю 20 вопросов Have you ever…?, не повторяясь. На время — четыре минуты.","Follow-up drill: на каждое Yes, I have студент обязан задать два уточняющих вопроса в Past Simple. Это главный навык урока.","My list of ten: назвать десять вещей, которых ты никогда не делал, и выбрать одну на этот месяц.","Two minutes: «The best thing I've ever done» — монолог с конкретной историей внутри."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. ______ you ever worked abroad?","2. I ______ (work) in Turkey in 2021.","3. I have ______ sent it. (already)","4. She hasn't called ______. (yet)","5. She has ______ to Dubai — she's there now. (gone)","6. Переведи: пока что — ______","7. Переведи: стоило того — ______","8. I've ______ finished — one minute ago. (just)","9. How long ______ you worked here?","10. Have you been there? — Yes, ______."],"a":"1 Have · 2 worked · 3 already · 4 yet · 5 gone · 6 so far · 7 worth it · 8 just · 9 have · 10 I have"},{"t":"Test 2 · фразовые глаголы","items":["1. I've ______ swimming at 34. (taken up)","2. I ______ coffee last year. (gave up)","3. She's ______ photography. (got into)","4. I've been ______ it for months. (putting off)","5. Переведи: рискнуть — ______","6. Переведи: привыкнуть к — ______","7. Переведи: достижение — ______","8. I don't ______ anything. (regret)","9. Переведи: с тех пор — ______","10. Переведи: возможность — ______"],"a":"1 taken up · 2 gave up · 3 got into · 4 putting off · 5 take a risk · 6 get used to · 7 achievement · 8 regret · 9 since then · 10 chance / opportunity"},{"t":"Test 3 · Повторение: вопросы всех времён (уроки 1, 5, 14, 24)","items":["1. Where ______ you work? (настоящее)","2. Where ______ you work before? (прошлое)","3. ______ you ever been to Dubai?","4. What ______ you doing at nine last night?","5. ______ you come tomorrow? (будущее)","6. How much ______ it cost?","7. Who ______ (call) this morning?","8. Could you tell me where the station ______?","9. ______ she like the film? (прошлое)","10. How long ______ you lived here?"],"a":"1 do · 2 did · 3 Have · 4 were · 5 Will · 6 does · 7 called · 8 is · 9 Did · 10 have"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 150 слов: «Three things I have done that I'm proud of». Каждый пункт: Present Perfect + деталь в Past Simple.","Аудио: ответить на 10 вопросов Have you ever…? полными ответами с деталями — 2 минуты."],"cando":["I can ask and answer Have you ever…? questions.","I can switch correctly between Present Perfect and Past Simple.","I can keep a conversation going with follow-up questions."]},{"n":30,"en":"Plans, dreams and changes","ru":"Планы, мечты и перемены","goal":"I can talk about my plans and explain why I want to change something.","goalRu":"Могу говорить о планах и объяснять, зачем хочу что-то изменить.","gramA":"will / going to / Present Continuous для будущего · when, as soon as, until + Present","gramB":"Повторение: want to / would like to / hope to (урок 25)","recycle":"Уроки 10, 25 — планы и цели","starters":["What is one thing you want to change in the next six months?","Do you plan your life, or do you prefer to see what happens?","What is a dream you've had for years but haven't started yet?"],"vocab":[["change my mind","передумать","I changed my mind at the last moment."],["make a decision","принять решение","I made the decision in one evening."],["take a step","сделать шаг","Take the first step this week."],["give it a try","попробовать","Just give it a try."],["sooner or later","рано или поздно","Sooner or later I will move."],["put something off","откладывать","Stop putting it off."],["as soon as","как только","I'll call as soon as I arrive."],["until","пока не","Wait until I come back."],["in the long run","в долгосрочной перспективе","In the long run it's cheaper."],["be worth doing","стоит делать","It's worth trying."],["afford","позволить себе","I can't afford it right now."],["figure out","разобраться, понять","I need to figure out the first step."],["stick with it","не бросать","Stick with it for three months."],["turning point","поворотный момент","That call was a turning point."]],"phrases":["I'm planning to…","I'm thinking of changing…","I haven't decided yet.","I'll probably…","That's the plan, anyway.","Sooner or later I'll have to…","As soon as I finish, I'll…","It's worth a try.","I've been meaning to do it for years.","Let's see how it goes."],"pv":[["go ahead","действовать, начинать","Go ahead, I'm listening."],["back out","отказаться в последний момент","He backed out two days before."],["work out","получаться, складываться","I hope it works out."],["settle down","осесть, остепениться","They want to settle down in Bishkek."],["set up","основать, наладить","She set up her own business."]],"rulesA":["going to — решено заранее: I'm going to apply in September. will — решение сейчас или прогноз: I'll help you. It will rain.","Present Continuous для будущего — договорённость с временем и местом: I'm meeting the manager at three on Friday.","После when, as soon as, until, before, after — НАСТОЯЩЕЕ время, даже если смысл будущий: I'll call you when I arrive (не when I will arrive).","until = пока не: Wait until I come back. Частая ошибка: until I won't come — так нельзя.","Степени уверенности: I'll definitely → I'll probably → I might → I probably won't → I definitely won't."],"rulesB":["want to — хочу: I want to change my job. would like to — вежливее и мягче: I'd like to work abroad.","hope to — надеюсь: I hope to finish in June.","be thinking of + -ing — размышляю: I'm thinking of moving.","Разница: I like coffee (вообще) vs I'd like a coffee (хочу сейчас)."],"examples":["I'm going to take the exam in December, and I'll probably apply in January.","As soon as I finish this course, I'm starting the next one.","I'm thinking of moving, but I haven't decided yet."],"text":{"title":"The three-month rule","words":220,"body":["I have a friend who starts something new every month. Guitar, running, Spanish, photography. He has started about forty things in the last three years. He has finished none of them.","I used to be the same. Then I made one rule for myself: three months, no decisions.","It works like this. When I start something, I promise myself I won't think about quitting until ninety days have passed. Not because ninety days make you good at anything. They don't. But the first three weeks are always exciting, weeks four to eight are boring, and week nine is when something clicks.","Most people quit in week five. They think they've lost interest. Usually they've just hit the boring part.","I've used this rule for English, for running and for one difficult work project. All three are still in my life.","My friend says my rule is too strict. Maybe. But last month he told me he's going to learn Japanese, and I asked him one question: 'What happened to the guitar?'","He laughed and said, 'Fair point.'","He's starting the guitar again in September. This time with the three-month rule. We'll see how it goes."]},"textQs":["1. How many things has the friend started, and how many has he finished?","2. Explain the three-month rule in your own words.","3. What happens in weeks four to eight?","4. When do most people quit, and why does the writer think that's a mistake?","5. What did the friend decide at the end?","6. Is there something you quit too early? Would the rule have helped?"],"opinions":{"title":"Четыре плана на год","lines":["AIDA: I'm going to take an English exam in December. I've already booked it, so I can't back out.","MARAT: I'm thinking of setting up a small business, but I haven't decided yet. Maybe next year.","DINA: As soon as I finish this course, I'm applying for a job abroad. That's the plan, anyway.","BEK: I'll probably stay where I am. It's not exciting, but in the long run it's the right choice for my family."],"tasks":["1. Whose plan is already fixed and paid for?","2. Who is still only thinking about it?","3. Find one example of going to, one of Present Continuous for the future and one of will.","4. Write your own line for this board — two sentences with two different future forms."]},"audio":{"type":"Listen: a plan with a date","script":"Right, so here's my plan for this year. In March I'm finishing my course — the last lesson is on the fourteenth. As soon as it finishes, I'm going to update my CV. I'll probably apply for about ten jobs, maybe more. I'm not going to accept the first offer; I made that mistake in 2022. And I won't move cities until my daughter finishes school in June. If nothing works out by September, I'll stay another year and try again. That's the plan, anyway.","note":"Читай спокойно, два раза. Студент записывает план и первый шаг.","tasks":["1. When does the course finish?","2. What is the first step after that?","3. How many jobs will the speaker apply for?","4. What mistake did the speaker make in 2022?","5. Why won't the speaker move before June?","6. What happens if nothing works by September?"],"answers":"1 В марте, последний урок четырнадцатого. · 2 Обновить резюме. · 3 Примерно десять, может больше. · 4 Принял первое же предложение. · 5 Дочь заканчивает школу в июне. · 6 Останется ещё на год и попробует снова."},"dialogue":{"title":"So what's the plan?","setting":"Dina (D) и Erlan (E) после занятия.","lines":[["D","So what's the plan after this course? Have you decided?"],["E","Kind of. I'm going to take the exam in December."],["D","Nice. Have you booked it?"],["E","Not yet. I'll book it as soon as I get my salary."],["D","Book it now. Once you pay, you can't back out."],["E","That's exactly why I'm putting it off."],["D","I know that feeling. What about work — are you staying?"],["E","I'm thinking of changing, but I haven't decided yet."],["D","What's stopping you?"],["E","Honestly? I'm comfortable. The job is fine, the people are fine."],["D","Fine is the most dangerous word in the language."],["E","You sound like my sister."],["D","Your sister is right. What would you do if money wasn't a problem?"],["E","I'd set up something of my own. A small travel agency, maybe."],["D","Then start small. Keep the job, try it at weekends for three months."],["E","That's… actually a good idea. Let's see how it goes."]],"tasks":["Прочитай диалог вслух за обе роли.","Найди все формы будущего — их семь. Объясни выбор каждой.","Переиграй: друг спрашивает о твоих планах, ты отвечаешь честно.","Запиши себя за Erlan — 90 секунд."]},"ex":[{"title":"Exercise 1. will, going to или Present Continuous?","items":["1. I've booked it — I ______ (take) the exam on the fifth.","2. The phone is ringing. — I ______ (answer) it.","3. I've decided: I ______ (apply) in September.","4. Look at those clouds! It ______ (rain).","5. I ______ (meet) the manager at three tomorrow. It's arranged.","6. Don't worry, I ______ (help) you with the report."]},{"title":"Exercise 2. Раскрой скобки после when / as soon as / until.","items":["1. I'll call you when I ______ (arrive).","2. As soon as the course ______ (finish), I'm applying.","3. We won't start until everybody ______ (be) here.","4. I'll tell you as soon as I ______ (know).","5. Wait here until I ______ (come) back."]},{"title":"Exercise 3. Расставь по уверенности от 100% к 0%.","items":["a) I might come   b) I definitely won't come   c) I'll definitely come","d) I probably won't come   e) I'll probably come","Запиши порядок: ______ ______ ______ ______ ______","Теперь напиши три своих предложения с разной уверенностью о следующем месяце."]}],"speaking":["Plan with dates: рассказать план на год так, чтобы в каждом пункте была дата или срок. Без «maybe someday».","Devil's advocate: студент называет план, преподаватель находит в нём слабое место, студент защищает или меняет план.","Chain of as soon as: «As soon as I finish the course, I'll…» — и дальше каждое следствие становится новым условием. Восемь звеньев.","Two minutes: «Where I'll be in three years» — с конкретными шагами, а не мечтами."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. I've decided — I ______ (take) the exam in December.","2. The phone is ringing. — I ______ answer it.","3. I ______ (meet) the client at three. It's arranged.","4. I'll call you when I ______ (arrive).","5. We won't start until she ______ (come).","6. Переведи: рано или поздно — ______","7. Переведи: передумать — ______","8. Переведи: как только — ______","9. I ______ probably come. (will)","10. Переведи: стоит попробовать — ______"],"a":"1 am going to take · 2 will · 3 'm meeting · 4 arrive · 5 comes · 6 sooner or later · 7 change my mind · 8 as soon as · 9 will · 10 it's worth a try"},{"t":"Test 2 · фразовые глаголы","items":["1. ______, I'm listening. (go ahead)","2. He ______ two days before the trip. (backed out)","3. I hope it ______. (works out)","4. She ______ her own business. (set up)","5. Переведи: осесть, остепениться — ______","6. Переведи: в долгосрочной перспективе — ______","7. Переведи: поворотный момент — ______","8. I can't ______ it right now. (afford)","9. Переведи: не бросай — ______","10. Переведи: разобраться — ______"],"a":"1 Go ahead · 2 backed out · 3 works out · 4 set up · 5 settle down · 6 in the long run · 7 turning point · 8 afford · 9 stick with it · 10 figure out"},{"t":"Test 3 · Повторение: будущее и условные (уроки 10, 19, 25)","items":["1. If it ______ (rain), we will stay at home.","2. Look at the clouds! It ______ rain.","3. I'd ______ a coffee, please.","4. I ______ to finish in June. (hope)","5. I'm ______ to apply in September.","6. Will you come? — Yes, ______.","7. I ______ be late. (отрицание, will)","8. Maybe I ______ come. (will)","9. Переведи: подтвердить — ______","10. Переведи: перенести встречу — ______"],"a":"1 rains · 2 is going to · 3 like · 4 hope · 5 going · 6 I will · 7 won't · 8 will · 9 confirm · 10 reschedule / postpone"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать план на год на 150 слов: каждый пункт с датой и первым шагом.","Аудио: 2 минуты — «My plan for this year», минимум три разные формы будущего."],"cando":["I can choose correctly between will, going to and Present Continuous.","I can use when, as soon as and until correctly.","I can explain a plan with concrete steps and dates."]},{"n":31,"en":"What would you do?","ru":"Гипотетические ситуации","goal":"I can discuss imaginary situations and give advice with 'If I were you'.","goalRu":"Могу обсуждать воображаемые ситуации и советовать через «на твоём месте».","gramA":"Second conditional · If I were you, I'd…","gramB":"Повторение: first conditional (урок 19)","recycle":"Уроки 19, 23, 30 — условные, проблемы, планы","starters":["If you could live in any country for one year, where would you go?","If you won a year's salary tomorrow, what would you do first?","If you could change one thing about your job, what would it be?"],"vocab":[["imagine","представь","Imagine you had no phone."],["suppose","предположим","Suppose you lost your job."],["in your shoes","на твоём месте","In your shoes I'd say no."],["hesitate","сомневаться, колебаться","Don't hesitate — call her."],["make up your mind","решиться","Make up your mind by Friday."],["risky","рискованный","It's a risky decision."],["safe choice","безопасный выбор","It's the safe choice, but boring."],["regret","сожалеть","You'll regret it if you don't try."],["unlikely","маловероятно","That's unlikely to happen."],["what if","а что если","What if nobody comes?"],["either way","в любом случае","Either way, tell him today."],["it's up to you","тебе решать","It's completely up to you."],["think twice","подумать дважды","I'd think twice before signing."],["trust your gut","доверять интуиции","Sometimes you have to trust your gut."]],"phrases":["What would you do if…?","If I were you, I'd…","I'd probably…","I wouldn't do that, honestly.","It's up to you, but…","Have you thought about…?","What if it doesn't work?","I'd rather wait than risk it.","That's what I would do, anyway.","It's easy to say from the outside."],"pv":[["think over","обдумать","Think it over for a day."],["turn down","отклонить","I'd turn down that offer."],["go for it","рискнуть и сделать","Honestly? Go for it."],["hold off","повременить","I'd hold off until January."],["weigh up","взвесить","Weigh up the pros and cons."]],"rulesA":["Second conditional — воображаемая ситуация: If + Past Simple, would + глагол. If I had more time, I would travel.","Это НЕ про прошлое. Past Simple здесь означает «нереально сейчас», а не «вчера».","If I were you — устойчивая форма совета. Именно were, не was, для всех лиц.","Сокращение: I'd = I would. I'd go. I wouldn't go.","Сравни: If I have time, I'll call (реально сегодня) vs If I had time, I'd call (но времени нет)."],"rulesB":["First conditional — реально: If + Present Simple, will + глагол. If it rains, I'll take a taxi.","В части с if НИКОГДА нет will: If it will rain — ошибка.","unless = if not: I'll come unless something happens.","Порядок можно менять: I'll take a taxi if it rains. Смысл тот же, запятая не нужна."],"examples":["If I were you, I'd think it over for a couple of days.","If I had the money, I'd set up my own business.","If the client calls tomorrow, I'll tell him the truth. (реально)"],"text":{"title":"The offer I turned down","words":225,"body":["Two years ago I got an offer that looked perfect on paper. Forty per cent more money, a new city, a big company.","I said no.","People still ask me about it. Some think I'm crazy. One colleague said, 'If I were you, I'd have taken it in five minutes.' Maybe he's right. But he didn't see what I saw.","At the interview I asked one question: 'How long has this position been open?' The answer was eleven months. Then I asked how many people had been in that role in three years. Four.","If four people leave a job in three years, the problem is not the people.","So I weighed it up. If I took the job, I'd earn more and I'd learn a lot in the first six months. But if the same thing happened to me, I'd be looking for work again in a year, in a city where I knew nobody.","I turned it down. Six months later a friend from that company told me the whole team had changed again.","I'm not saying I was clever. If the answer had been 'two months, one person', I'd be living in that city now. I'm saying one question saved me a year of my life.","If you're ever in that situation, ask it."]},"textQs":["1. What was good about the offer?","2. What two questions did the writer ask at the interview?","3. What did the answers tell him?","4. What did he imagine would happen in a year?","5. What does he say he is NOT claiming?","6. Would you have taken the job? Explain with 'If I were him, I'd…'"],"opinions":{"title":"Что бы вы сделали? Четыре ответа","lines":["DINA: If I got that offer, I'd take it. You can always leave again. You can't un-say no.","MARAT: I'd hold off and ask for two weeks to think. If they say no to two weeks, that's your answer.","AIDA: Honestly, I'd turn it down too. Money is easy to replace, a year of your life isn't.","BEK: It's up to you, but I'd weigh up one thing: would you still want it if the salary were the same?"],"tasks":["1. Who would accept the offer immediately?","2. Whose advice is a test rather than an answer?","3. Find four examples of the second conditional.","4. Write your own advice in two sentences, starting with 'If I were him…'"]},"audio":{"type":"Listen: giving advice","script":"A: Can I ask your advice about something? B: Of course, go ahead. A: I've been offered a job in another city. More money, but I'd have to move in six weeks. B: Hmm. What does your family say? A: My wife says it's up to me. That's the problem — I want someone to decide for me. B: Nobody can. But if I were you, I'd do three things. First, I'd visit the city for a weekend before deciding. Second, I'd ask them for a written offer, not a phone call. And third, I'd ask what happened to the person who had the job before you. A: That's a good question, actually. B: It's the only question I'd really care about.","note":"Читай в два голоса. Два раза. Студент записывает проблему и три совета.","tasks":["1. What is A's problem?","2. How long does A have before moving?","3. What did A's wife say, and why is that difficult?","4. What is the first piece of advice?","5. What is the second?","6. Which question does B say is the most important?"],"answers":"1 Предложили работу в другом городе. · 2 Шесть недель. · 3 «Тебе решать» — а он хочет, чтобы решил кто-то другой. · 4 Съездить в город на выходные до решения. · 5 Попросить письменное предложение, а не звонок. · 6 Что случилось с человеком, который работал на этой позиции до тебя."},"dialogue":{"title":"If I were you","setting":"Bek (B) советуется с Aida (A).","lines":[["B","Aida, can I ask you something? It's a bit personal."],["A","Go ahead."],["B","My brother wants to borrow money. Quite a lot. For a business idea."],["A","Ah. And what does your gut say?"],["B","My gut says no. My head says he's my brother."],["A","What would happen if you said no?"],["B","He'd be angry for a month. Maybe longer."],["A","And what would happen if you said yes and the business failed?"],["B","Then we'd both be angry, and there'd be money in the middle of it."],["A","So you've already answered your own question."],["B","I know. But what if it works and I said no?"],["A","Then you'd be the brother who said no to a success story. That's uncomfortable, but it's survivable."],["B","You're not making this easier."],["A","If I were you, I'd offer something else — not money. Time, help, contacts."],["B","He doesn't need my time, he needs cash."],["A","Then say no clearly and say it this week. The worst version is a slow maybe."]],"tasks":["Прочитай диалог вслух за обе роли.","Найди все второй условные — их шесть.","Переиграй: у тебя своя дилемма, преподаватель советует через If I were you.","Запиши себя за Aida — 90 секунд."]},"ex":[{"title":"Exercise 1. Раскрой скобки (second conditional).","items":["1. If I ______ (have) more time, I ______ (travel) more.","2. If I ______ (be) you, I ______ (take) the job.","3. What ______ you ______ (do) if you ______ (lose) your phone?","4. She ______ (not / move) if the salary ______ (be) the same.","5. If we ______ (live) closer, we ______ (meet) every week."]},{"title":"Exercise 2. First или second conditional?","items":["1. If it ______ (rain) tomorrow, we ______ (stay) at home.","2. If I ______ (win) a million, I ______ (buy) a house by the sea.","3. If you ______ (call) me tonight, I ______ (explain) everything.","4. If I ______ (be) taller, I ______ (play) basketball.","5. If the client ______ (not / answer), I ______ (send) a reminder."]},{"title":"Exercise 3. Дай совет с If I were you.","items":["1. «I'm always late for work.» → ______","2. «My English isn't improving.» → ______","3. «My colleague takes all the credit for my work.» → ______","4. «I want to change jobs but I'm scared.» → ______","5. «I never have time for the gym.» → ______"]}],"speaking":["Dilemma cards: преподаватель читает ситуацию, студент за 60 секунд даёт совет и обосновывает. Пять ситуаций.","What if: цепочка из восьми вопросов What would you do if…? без повторов.","Agony aunt: студент — ведущий колонки советов, преподаватель приносит три проблемы.","Two minutes: «One decision I would make differently» — с объяснением через second conditional."],"tests":[{"t":"Test 1 · грамматика и слова","items":["1. If I ______ (have) more time, I'd travel.","2. If I ______ you, I'd take the job. (were)","3. What ______ you do if you lost your passport?","4. If it ______ (rain) tomorrow, we'll stay home.","5. She ______ (not / move) if the salary were the same.","6. Переведи: на твоём месте — ______","7. Переведи: тебе решать — ______","8. Переведи: подумать дважды — ______","9. ______ way, tell him today. (Either)","10. Переведи: а что если — ______"],"a":"1 had · 2 were · 3 would · 4 rains · 5 wouldn't move · 6 if I were you / in your shoes · 7 it's up to you · 8 think twice · 9 Either · 10 what if"},{"t":"Test 2 · фразовые глаголы","items":["1. ______ it over for a day. (Think)","2. I'd ______ that offer. (turn down)","3. Honestly? ______. (go for it)","4. I'd ______ until January. (hold off)","5. ______ the pros and cons. (Weigh up)","6. Переведи: рискованный — ______","7. Переведи: безопасный выбор — ______","8. Переведи: доверять интуиции — ______","9. Переведи: маловероятно — ______","10. Переведи: решиться — ______"],"a":"1 Think · 2 turn down · 3 go for it · 4 hold off · 5 Weigh up · 6 risky · 7 safe choice · 8 trust your gut · 9 unlikely · 10 make up your mind"},{"t":"Test 3 · Повторение: условные и советы (уроки 18, 19, 23)","items":["1. If we don't send it today, the client ______ be angry.","2. You ______ drink more water. (совет)","3. The printer broke, ______ we can't print.","4. If I ______ (be) you, I'd rest today.","5. We are late ______ there was traffic.","6. You ______ take photos here. It's forbidden.","7. You ______ pay — it's free.","8. Переведи: решение (проблемы) — ______","9. Переведи: извиняться — ______","10. I ______ (write) the email when I saw the mistake."],"a":"1 will · 2 should · 3 so · 4 were · 5 because · 6 mustn't · 7 don't have to · 8 solution · 9 apologise · 10 was writing"}],"hw":["Выучить 14 слов, 10 фраз и 5 фразовых глаголов.","Написать 150 слов: «If I could change one decision in my life». Минимум пять second conditional.","Аудио: 2 минуты — дать совет другу в сложной ситуации, минимум три If I were you."],"cando":["I can talk about imaginary situations with the second conditional.","I can give advice with 'If I were you, I'd…'.","I can tell the difference between a real and an imaginary condition."]},{"n":32,"en":"Problems and advice","ru":"Проблемы и советы","goal":"I can describe a problem and give several kinds of advice.","goalRu":"Могу описать проблему и дать совет разными способами.","gramA":"should / ought to / had better · Why don't you…? · How about + -ing","gramB":"Повторение: must / have to / don't have to (урок 21)","recycle":"Уроки 18, 21, 23 — советы, правила, проблемы","starters":["Who do you go to for advice, and why that person?","What advice have you received that you ignored — and later regretted?","Is it easier to give advice or to take it?"],"vocab":[["struggle with","мучиться с, с трудом справляться","I struggle with early mornings."],["deal with it","справиться с этим","I'll deal with it myself."],["stress out","нервничать","Don't stress out about it."],["burn out","выгореть","He burned out after two years."],["take a break","сделать перерыв","You should take a break."],["set limits","ставить границы","Learn to set limits at work."],["say no","отказывать","Saying no is a skill."],["overwhelmed","перегруженный","I feel completely overwhelmed."],["priority","приоритет","What's your first priority?"],["step back","отойти, посмотреть со стороны","Step back and look again."],["ask for help","просить помощи","Ask for help earlier."],["it's not the end of the world","это не конец света","Relax — it's not the end of the world."],["one thing at a time","по одному делу за раз","Do one thing at a time."],["get on top of","взять под контроль","I got on top of my inbox."]],"phrases":["I'm having trouble with…","I don't know what to do about…","Why don't you try…?","How about taking a break?","You'd better talk to him today.","Have you tried…?","If I were you, I'd start with…","That's easier said than done.","You're not alone — everybody struggles with that.","Take it one step at a time."],"pv":[["cheer up","приободриться","Cheer up — it'll pass."],["calm down","успокоиться","Calm down and start again."],["get over","пережить, справиться","It took a month to get over it."],["put up with","терпеть","I won't put up with that."],["sort out","уладить","Let's sort this out today."]],"rulesA":["should — обычный совет: You should talk to her. ought to — то же самое, чуть формальнее: You ought to see a doctor.","had better ('d better) — сильный совет с предупреждением: You'd better leave now or you'll miss it. Внимание: без to.","Why don't you + глагол: Why don't you ask your manager?","How about / What about + глагол с -ing: How about taking a day off?","Мягче всего звучит вопрос, а не приказ: Have you tried…? вместо You must…"],"rulesB":["must — сильное правило или личная убеждённость: You must show your passport.","have to — необходимость по обстоятельствам: I have to work on Saturday.","don't have to — НЕ обязательно. mustn't — нельзя. Это разные вещи.","Совет мягче правила: You should rest (совет) vs You must rest (почти приказ)."],"examples":["You'd better talk to her today — tomorrow will be harder.","Why don't you take a day off? How about going somewhere for the weekend?","You don't have to answer emails at night. Nobody expects it."],"text":{"title":"The inbox that never ended","words":220,"body":["Two years ago I was proud of answering every email within ten minutes. I thought it made me a good professional. It made me a tired one.","The problem started slowly. I began checking messages before breakfast. Then in the evening. Then on Sunday. By December I was reading work emails in bed at eleven at night and feeling nervous if I didn't.","A colleague noticed before I did. She said one sentence: 'You'd better set some limits, or the job will set them for you.'","I didn't take her advice immediately. I said what everybody says: 'That's easier said than done.'","Then I burned out for three weeks in January. Not dramatically — I just stopped being able to think.","So I made three rules. No email before nine or after seven. Sunday is off, completely. And if something is really urgent, people can call me — in two years that has happened four times.","The interesting part is that nothing bad happened. No client left. Nobody complained. It turned out the only person who demanded instant answers was me.","If a colleague came to me now with the same problem, I'd say what she said. And they'd probably answer what I answered."]},"textQs":["1. What was the writer proud of at the beginning?","2. Describe how the problem developed step by step.","3. What did the colleague say?","4. What three rules did the writer make?","5. What was surprising about the result?","6. Do you have limits with work messages? What would you change?"],"opinions":{"title":"Advice board — четыре ответа на одну проблему","lines":["PROBLEM — AIDA: I can't say no at work. I take every task and then I can't sleep.","MARAT: You'd better start with one small no this week. Don't try to change everything at once.","DINA: Why don't you ask your manager to put the tasks in order of priority? Then saying no isn't your decision.","BEK: How about writing down everything you do for one week? Most people say no more easily when they see the list."],"tasks":["1. Which advice makes the manager part of the solution?","2. Which advice starts smallest?","3. Find one example each of had better, Why don't you and How about.","4. Write your own advice for Aida in two sentences."]},"audio":{"type":"Listen: three pieces of advice","script":"A: Can I talk to you for a minute? I'm struggling with the new project. B: Of course. What exactly is the problem? A: There's too much of it. I'm working until eight every evening and I'm still behind. B: Have you told the manager? A: No. I don't want to look weak. B: That's the first thing I'd change. Asking for help early isn't weak; asking in week six is. A: Fair. B: Second, why don't you split the project into weeks instead of looking at the whole thing? A: I've tried, but everything feels urgent. B: Then you'd better ask the manager which part is really urgent. That's his job, not yours. A: OK. I'll talk to him tomorrow. B: Today. Tomorrow is how week six happens.","note":"Читай в два голоса. Два раза. Студент записывает проблему и советы.","tasks":["1. What is A struggling with?","2. Until what time is A working?","3. Why hasn't A talked to the manager?","4. What is B's first piece of advice?","5. What is the second?","6. Why does B say 'Today', not 'Tomorrow'?"],"answers":"1 С новым проектом. · 2 До восьми вечера. · 3 Не хочет выглядеть слабым. · 4 Просить помощи рано — это не слабость; слабость — просить на шестой неделе. · 5 Разбить проект по неделям, а не смотреть на всё целиком. · 6 Потому что «завтра» и приводит к шестой неделе."},"dialogue":{"title":"I don't know what to do","setting":"Erlan (E) и Dina (D) в кафе.","lines":[["E","Dina, I need advice. I'm completely overwhelmed."],["D","Tell me what's going on."],["E","Three projects, one deadline, and my colleague is on holiday."],["D","Have you told your manager it's three projects?"],["E","He knows. He says everything is a priority."],["D","Then nothing is. Why don't you ask him to put them in order on paper?"],["E","That's easier said than done."],["D","Maybe. But a list takes him two minutes and saves you two weeks."],["E","OK, fair point."],["D","And how about doing one thing at a time? You're probably switching between all three."],["E","All day. Every day."],["D","That's why you're tired, not because of the work."],["E","So what would you do first?"],["D","I'd email him tonight, one short message, three lines. And I'd better not see you here on Saturday."],["E","Deal. And thanks — I just needed someone to say it out loud."],["D","That's what the coffee is for."]],"tasks":["Прочитай диалог вслух за обе роли.","Выпиши все способы дать совет — их пять разных конструкций.","Переиграй: у тебя реальная проблема с работой или учёбой, преподаватель советует.","Запиши себя за Dina — 90 секунд."]},"ex":[{"title":"Exercise 1. Дай совет четырьмя способами на одну проблему.","items":["Проблема: «I'm always tired in the morning.»","1. should → ______","2. Why don't you →
