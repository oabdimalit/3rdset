let cur = null, sec = 0, teacher = false;
const st = { fc:{}, said:{}, vote:{}, can:{}, ans:{} };
try { Object.assign(st, JSON.parse(localStorage.getItem("su3")||"{}")); } catch(e){}
const save = () => { try{ localStorage.setItem("su3", JSON.stringify(st)); }catch(e){} };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* ---------- экран выбора ---------- */
document.getElementById("grid").innerHTML = L.map((l,i)=>`
  <button class="lcard" data-i="${i}">
    <div class="lnum">${l.n}</div>
    <h3>${esc(l.en)}</h3>
    <div class="lru">${esc(l.ru)}</div>
    <div class="lg">${esc(l.gramA)}</div>
  </button>`).join("");
document.getElementById("grid").addEventListener("click", e=>{
  const b = e.target.closest(".lcard"); if(!b) return;
  open(+b.dataset.i);
});

function open(i){
  cur = i; sec = 0;
  document.getElementById("picker").style.display="none";
  document.getElementById("wrap").classList.add("on");
  document.getElementById("nav").classList.add("on");
  document.getElementById("ttl").textContent = "Урок "+L[i].n+" · "+L[i].en;
  document.getElementById("rail").innerHTML = SECS.map((s,k)=>
    `<button class="rb" data-k="${k}">${s.ic} ${s.t}</button>`).join("");
  render();
  window.scrollTo({top:0});
}
function home(){
  document.getElementById("picker").style.display="";
  document.getElementById("wrap").classList.remove("on");
  document.getElementById("nav").classList.remove("on");
  document.getElementById("ttl").textContent = "Выбери урок";
  window.scrollTo({top:0});
}
document.getElementById("home").addEventListener("click", home);

/* ---------- рендер секции ---------- */
function render(){
  const l = L[cur], s = SECS[sec];
  [...document.querySelectorAll(".rb")].forEach((b,k)=>b.classList.toggle("on", k===sec));
  const active = document.querySelector(".rb.on");
  if(active) active.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  document.getElementById("pb").style.width = ((sec+1)/SECS.length*100)+"%";
  document.getElementById("prev").disabled = sec===0;
  document.getElementById("next").textContent = sec===SECS.length-1 ? "Готово ✓" : "Дальше →";

  let h = `<div class="sec on"><div class="sh"><span class="chip">${s.ic} ${s.t}</span><h2>${head(l,s.k)}</h2></div><p class="sd">${s.d}</p>`;
  h += BUILD[s.k](l);
  h += "</div>";
  document.getElementById("body").innerHTML = h;
  bind(s.k, l);
  window.scrollTo({top:0, behavior:"smooth"});
}
function head(l,k){
  return {start:"Conversation starters", vocab:"14 слов урока", phr:"Phrase bank", pv:"Фразовые глаголы",
    gramA:l.gramA, gramB:"Повторяем пройденное", read:l.text.title, qs:"Вопросы к тексту",
    op:l.opinions.title, list:l.audio.type, dlg:l.dialogue.title, ex:"Практика",
    sp:"Говорим", test:"Проверь себя", hw:"Домашнее задание", can:"Что я теперь умею"}[k];
}

const timerHTML = (sec,label) => `<div class="timer">
  <button class="tbtn2" data-tm="${sec}">▶ ${label}</button>
  <span class="clock">${fmt(sec)}</span></div>`;
const fmt = s => Math.floor(s/60)+":"+String(s%60).padStart(2,"0");

const BUILD = {
  start: l => l.starters.map((q,i)=>`<div class="card"><div class="q-row"><div class="q-n">${i+1}</div>
    <div class="q-t">${esc(q)}</div></div>${timerHTML(60,"60 секунд")}</div>`).join("")
    + `<div class="card soft"><button class="tbtn2 alt" id="rand">🎲 Случайный вопрос</button>
       <div id="randout" style="margin-top:12px;font-size:17px"></div></div>`,

  vocab: l => `<div class="fc-wrap">
    <div class="fc-bar"><i id="fcbar"></i></div>
    <div class="fc" id="fc"><div class="fc-in">
      <div class="fc-f"><div class="fc-hint">нажми, чтобы перевернуть</div>
        <div class="fc-w" id="fcw"></div><div class="fc-ex" id="fce"></div></div>
      <div class="fc-b"><div class="fc-hint" style="color:#9CD6CC">перевод</div>
        <div class="fc-w" id="fcr"></div><div class="fc-ex" id="fce2"></div></div>
    </div></div>
    <div class="fc-ctl">
      <button class="fcb no" id="fcNo">↻ Повторить</button>
      <span id="fcCnt" style="align-self:center;color:var(--mut);font-size:14px"></span>
      <button class="fcb yes" id="fcYes">✓ Знаю</button>
    </div>
    <button class="fcb" id="fcReset" style="font-size:13px">Начать колоду заново</button></div>`,

  phr: l => l.phrases.map((p,i)=>`<div class="ph ${st.said[l.n+"_"+i]?"said":""}" data-ph="${i}">
      <div class="mark">✓</div><div>${esc(p)}</div></div>`).join("")
    + `<div class="card soft" style="margin-top:14px">Произнеси каждую фразу вслух три раза и отметь. Выученная фраза — это та, которую ты сказал, а не прочитал.</div>`,

  pv: l => l.pv.map(v=>`<div class="card"><div style="display:flex;gap:12px;flex-wrap:wrap;align-items:baseline">
      <b style="font-size:19px;color:var(--brand)">${esc(v[0])}</b>
      <span style="color:var(--amber);font-size:14.5px">${esc(v[1])}</span></div>
      <div style="font-style:italic;color:var(--mut);margin-top:7px">${esc(v[2])}</div>
      <input placeholder="Твоё предложение с этим глаголом…" data-ans="pv${esc(v[0])}" style="width:100%;margin-top:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font:inherit"></div>`).join(""),

  gramA: l => l.rulesA.map((r,i)=>`<div class="acc"><button class="acc-h"><span class="ix">${i+1}</span>
      <span>${esc(r.split(":")[0])}${r.includes(":")?":":""}</span><span class="arr">▾</span></button>
      <div class="acc-b">${esc(r)}</div></div>`).join("")
    + `<div class="card soft" style="margin-top:14px"><b>Примеры</b>${l.examples.map(e=>`<div style="margin-top:9px;font-style:italic;color:var(--brand)">→ ${esc(e)}</div>`).join("")}</div>`,

  gramB: l => `<div class="card soft" style="margin-bottom:14px"><b>${esc(l.gramB)}</b><br><span style="color:var(--mut);font-size:14px">Повторяем: ${esc(l.recycle)}</span></div>`
    + l.rulesB.map((r,i)=>`<div class="acc"><button class="acc-h"><span class="ix" style="background:var(--brand-l);color:var(--brand)">${i+1}</span>
      <span>${esc(r.split(":")[0])}${r.includes(":")?":":""}</span><span class="arr">▾</span></button>
      <div class="acc-b">${esc(r)}</div></div>`).join(""),

  read: l => `<div class="rtools">
      <button class="rt" data-r="big">Крупный шрифт</button>
      <button class="rt" data-r="hide">Скрыть текст (пересказ)</button>
      <span class="rt" style="border:none;color:var(--mut)">${l.text.words} слов</span></div>
    <div class="reader" id="reader">${l.text.body.map(p=>`<p>${esc(p)}</p>`).join("")}</div>
    ${timerHTML(120,"Пересказ 2 минуты")}`,

  qs: l => l.textQs.map((q,i)=>`<div class="card"><div class="q-row"><div class="q-n">${i+1}</div>
      <div class="q-t">${esc(q.replace(/^\d+\.\s*/,""))}</div></div>
      <input placeholder="Ответь полным предложением…" data-ans="q${l.n}_${i}" style="width:100%;margin-top:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font:inherit"></div>`).join(""),

  op: l => l.opinions.lines.map((o,i)=>{
      const sp = o.split(":"); const who = sp.shift(); const txt = sp.join(":");
      const v = st.vote[l.n+"_"+i];
      return `<div class="op"><div class="who">${esc(who)}</div><div>${esc(txt.trim())}</div>
        <div class="vote"><button class="vb a ${v==="a"?"on":""}" data-v="a" data-i="${i}">👍 Согласен</button>
        <button class="vb d ${v==="d"?"on":""}" data-v="d" data-i="${i}">👎 Не согласен</button></div></div>`;
    }).join("") + `<div class="card soft" style="margin-top:14px"><b>Теперь скажи вслух</b><div style="margin-top:8px;color:var(--mut)">Выбери одно мнение и объясни за 60 секунд, почему ты согласен или нет. Используй «I see your point, but…» или «I'd say the opposite».</div>${timerHTML(60,"60 секунд")}</div>`
    + l.opinions.tasks.map((t,i)=>`<div class="card"><div class="q-t">${esc(t)}</div>
      <input placeholder="Ответ…" data-ans="op${l.n}_${i}" style="width:100%;margin-top:11px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font:inherit"></div>`).join(""),

  list: l => `<div class="tnote ${teacher?"on":""}"><b>Скрипт для преподавателя:</b><br>${esc(l.audio.script)}</div>`
    + `<div class="card soft">${esc(l.audio.note)}</div>`
    + l.audio.tasks.map((t,i)=>`<div class="card"><div class="q-t">${esc(t)}</div>
      <input placeholder="Ответ…" data-ans="a${l.n}_${i}" style="width:100%;margin-top:10px;padding:10px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--soft);color:var(--ink);font:inherit"></div>`).join("")
    + `<div class="key ${teacher?"on":""}"><b>Ключ:</b> ${esc(l.audio.answers)}</div>`,

  dlg: l => `<div class="rtools">
      <button class="rt on" data-d="both">Обе роли</button>
      <button class="rt" data-d="a">Скрыть первую роль</button>
      <button class="rt" data-d="b">Скрыть вторую роль</button></div>
    <p class="sd">${esc(l.dialogue.setting)}</p>
    <div class="dlg" id="dlg">${l.dialogue.lines.map((d,i)=>
      `<div class="dline" data-w="${esc(d[0])}" data-i="${i}"><div class="dwho">${esc(d[0])}</div><div class="dtxt">${esc(d[1])}</div></div>`).join("")}</div>
    <div class="card soft" style="margin-top:14px"><b>Как работать</b>${l.dialogue.tasks.map(t=>`<div style="margin-top:8px">• ${esc(t)}</div>`).join("")}</div>`,

  ex: l => l.ex.map((e,ei)=>`<div class="card"><b style="color:var(--amber)">${esc(e.title)}</b>
      ${e.items.map((it,ii)=>`<div class="ex-i">${esc(it)}
        <input placeholder="…" data-ans="e${l.n}_${ei}_${ii}"></div>`).join("")}</div>`).join(""),

  sp: l => l.speaking.map((s,i)=>{
      const m = s.match(/(\d+)\s*(минут|сек)/);
      const t = s.includes("90") ? 90 : s.includes("три минут") ? 180 : s.includes("2 минут") || s.includes("две минут") ? 120 : 60;
      return `<div class="sp"><span class="spn">${i+1}</span>${esc(s)}${timerHTML(t, fmt(t))}</div>`;
    }).join(""),

  test: l => l.tests.map((t,ti)=>`<div class="card"><b style="color:var(--brand)">${esc(t.t)}</b>
      ${t.items.map((it,ii)=>`<div class="ex-i">${esc(it)}
        <input placeholder="…" data-ans="t${l.n}_${ti}_${ii}"></div>`).join("")}
      <div class="key ${teacher?"on":""}"><b>Ключ:</b> ${esc(t.a)}</div></div>`).join("")
    + (teacher ? "" : `<div class="card soft">Ключей здесь нет — это специально. Сначала попробуй сам, даже если не уверен.</div>`),

  hw: l => l.hw.map((h,i)=>`<div class="card"><div class="q-row"><div class="q-n">${i+1}</div>
      <div class="q-t">${esc(h)}</div></div></div>`).join(""),

  can: l => l.cando.map((c,i)=>`<div class="cando ${st.can[l.n+"_"+i]?"yes":""}" data-can="${i}">
      <div class="cb">✓</div><div>${esc(c)}</div></div>`).join("")
    + `<div class="card soft" style="margin-top:14px">Если хотя бы один пункт «ещё нет» — вернись к нужному разделу через меню сверху.</div>`
};

/* ---------- обработчики ---------- */
function bind(k,l){
  document.querySelectorAll("[data-tm]").forEach(b=>{
    const span = b.parentElement.querySelector(".clock");
    let id=null, left=+b.dataset.tm;
    b.addEventListener("click",()=>{
      if(id){ clearInterval(id); id=null; b.textContent="▶ Продолжить"; span.classList.remove("run"); return; }
      b.textContent="⏸ Пауза"; span.classList.add("run");
      id=setInterval(()=>{
        left--; span.textContent=fmt(Math.max(0,left));
        if(left<=0){ clearInterval(id); id=null; span.classList.remove("run"); span.classList.add("end");
          b.textContent="▶ Заново"; left=+b.dataset.tm; }
      },1000);
    });
  });
  document.querySelectorAll("[data-ans]").forEach(i=>{
    const key=i.dataset.ans;
    if(st.ans[key]) i.value=st.ans[key];
    i.addEventListener("input",()=>{ st.ans[key]=i.value; save(); });
  });
  document.querySelectorAll(".acc-h").forEach(b=>
    b.addEventListener("click",()=>b.parentElement.classList.toggle("open")));

  if(k==="start"){
    const r=document.getElementById("rand");
    r && r.addEventListener("click",()=>{
      const q=l.starters[Math.floor(Math.random()*l.starters.length)];
      document.getElementById("randout").textContent="🎯 "+q;
    });
  }
  if(k==="vocab") initCards(l);
  if(k==="phr"){
    document.querySelectorAll("[data-ph]").forEach(el=>el.addEventListener("click",()=>{
      const key=l.n+"_"+el.dataset.ph;
      st.said[key]=!st.said[key]; el.classList.toggle("said"); save();
    }));
  }
  if(k==="read"){
    document.querySelectorAll("[data-r]").forEach(b=>b.addEventListener("click",()=>{
      const rd=document.getElementById("reader");
      if(b.dataset.r==="big"){ rd.classList.toggle("big"); b.classList.toggle("on"); }
      else { const hid=rd.style.visibility==="hidden";
        rd.style.visibility=hid?"":"hidden"; b.classList.toggle("on",!hid); }
    }));
  }
  if(k==="op"){
    document.querySelectorAll(".vb").forEach(b=>b.addEventListener("click",()=>{
      const key=l.n+"_"+b.dataset.i;
      st.vote[key]=b.dataset.v; save();
      const box=b.closest(".vote");
      box.querySelectorAll(".vb").forEach(x=>x.classList.toggle("on", x===b));
    }));
  }
  if(k==="dlg"){
    const first=l.dialogue.lines[0][0];
    document.querySelectorAll("[data-d]").forEach(b=>b.addEventListener("click",()=>{
      document.querySelectorAll("[data-d]").forEach(x=>x.classList.toggle("on",x===b));
      document.querySelectorAll(".dline").forEach(d=>{
        const isFirst = d.dataset.w===first;
        d.classList.toggle("hid",
          (b.dataset.d==="a"&&isFirst) || (b.dataset.d==="b"&&!isFirst));
      });
    }));
    document.querySelectorAll(".dline .dtxt").forEach(t=>t.addEventListener("click",()=>
      t.parentElement.classList.remove("hid")));
  }
  if(k==="can"){
    document.querySelectorAll("[data-can]").forEach(el=>el.addEventListener("click",()=>{
      const key=l.n+"_"+el.dataset.can;
      st.can[key]=!st.can[key]; el.classList.toggle("yes"); save();
    }));
  }
}

/* ---------- флеш-карточки ---------- */
function initCards(l){
  let deck=l.vocab.map((v,i)=>i), pos=0, again=[];
  const fc=document.getElementById("fc");
  const show=()=>{
    if(pos>=deck.length){
      if(again.length){ deck=again.slice(); again=[]; pos=0; }
      else { document.getElementById("fcw").textContent="Готово 🎉";
        document.getElementById("fce").textContent="Вся колода пройдена";
        document.getElementById("fcr").textContent="Отлично";
        document.getElementById("fce2").textContent="";
        document.getElementById("fcCnt").textContent=l.vocab.length+" / "+l.vocab.length;
        document.getElementById("fcbar").style.width="100%"; return; }
    }
    const v=l.vocab[deck[pos]];
    fc.classList.remove("flip");
    document.getElementById("fcw").textContent=v[0];
    document.getElementById("fce").textContent=v[2];
    document.getElementById("fcr").textContent=v[1];
    document.getElementById("fce2").textContent=v[2];
    document.getElementById("fcCnt").textContent=(pos+1)+" / "+deck.length;
    document.getElementById("fcbar").style.width=(pos/deck.length*100)+"%";
  };
  fc.addEventListener("click",()=>fc.classList.toggle("flip"));
  document.getElementById("fcYes").addEventListener("click",()=>{ pos++; show(); });
  document.getElementById("fcNo").addEventListener("click",()=>{ again.push(deck[pos]); pos++; show(); });
  document.getElementById("fcReset").addEventListener("click",()=>{ deck=l.vocab.map((v,i)=>i); pos=0; again=[]; show(); });
  show();
}

/* ---------- навигация ---------- */
document.getElementById("rail").addEventListener("click",e=>{
  const b=e.target.closest(".rb"); if(!b) return;
  sec=+b.dataset.k; render();
});
document.getElementById("next").addEventListener("click",()=>{
  if(sec<SECS.length-1){ sec++; render(); }
  else { document.querySelectorAll(".rb")[sec].classList.add("done"); home(); }
});
document.getElementById("prev").addEventListener("click",()=>{ if(sec>0){ sec--; render(); } });
document.addEventListener("keydown",e=>{
  if(cur===null) return;
  if(e.key==="ArrowRight"&&sec<SECS.length-1){ sec++; render(); }
  if(e.key==="ArrowLeft"&&sec>0){ sec--; render(); }
});

/* ---------- режим преподавателя и тема ---------- */
const tb=document.getElementById("tmode");
try{ teacher = localStorage.getItem("su3_t")==="1"; }catch(e){}
tb.classList.toggle("on",teacher);
tb.addEventListener("click",()=>{
  teacher=!teacher; tb.classList.toggle("on",teacher);
  try{ localStorage.setItem("su3_t", teacher?"1":"0"); }catch(e){}
  if(cur!==null) render();
});
const th=document.getElementById("theme");
th.addEventListener("click",()=>{
  const c=document.documentElement.getAttribute("data-theme");
  const n=c==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",n);
  try{ localStorage.setItem("su3_th",n); }catch(e){}
});
try{ const t=localStorage.getItem("su3_th"); if(t) document.documentElement.setAttribute("data-theme",t); }catch(e){}
</script>
